<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="560" height="130" role="img" aria-label="TruDealer — Future Automotive">
  <title>TruDealer lockup</title>
  <defs>
    <linearGradient id="lkCyan" x1="14" y1="20" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CF3ED"/>
      <stop offset="0.55" stop-color="#4FE3DC"/>
      <stop offset="1" stop-color="#2BB6B0"/>
    </linearGradient>
    <linearGradient id="lkSteel" x1="0" y1="30" x2="0" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9C0C4"/>
    </linearGradient>
    <linearGradient id="lkWordCyan" x1="270" y1="30" x2="540" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CF3ED"/>
      <stop offset="1" stop-color="#3FCFC8"/>
    </linearGradient>
  </defs>

  <g transform="translate(0,15)">
    <g fill="none" stroke="url(#lkCyan)" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round">
