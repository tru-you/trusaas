    </g>
  </g>

  <rect x="108" y="26" width="1.5" height="74" fill="#2A3138"/>

  <text x="136" y="80"
        font-family="Inter,'Helvetica Neue',Arial,system-ui,sans-serif"
        font-size="64" font-weight="700" letter-spacing="-2.6">
    <tspan fill="url(#lkSteel)">Tru</tspan><tspan fill="url(#lkWordCyan)">Dealer</tspan>
  </text>
  <text x="139" y="108"
        font-family="Inter,'Helvetica Neue',Arial,system-ui,sans-serif"
        font-size="16" font-weight="500" letter-spacing="3"
        fill="#8E979C">FUTURE AUTOMOTIVE</text>
