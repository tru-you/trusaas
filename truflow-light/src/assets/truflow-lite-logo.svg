<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" fill="none" role="img" aria-label="TruFlow Lite">
  <defs>
    <linearGradient id="tf-lite-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D9BFF"/>
      <stop offset="45%" stop-color="#1466E0"/>
      <stop offset="100%" stop-color="#15C7C0"/>
    </linearGradient>
    <linearGradient id="tf-lite-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="tf-lite-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glass orb mark -->
  <g filter="url(#tf-lite-soft)" transform="translate(8,12)">
    <circle cx="36" cy="36" r="34" fill="url(#tf-lite-glow)" opacity="0.18"/>
    <circle cx="36" cy="36" r="28" fill="rgba(15,24,38,0.55)" stroke="url(#tf-lite-glow)" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="28" fill="url(#tf-lite-glass)"/>
    <!-- Flow diamonds -->
    <path d="M22 36 L36 18 L50 36 L36 54 Z" fill="none" stroke="url(#tf-lite-glow)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M30 36 L36 28 L42 36 L36 44 Z" fill="url(#tf-lite-glow)" opacity="0.95"/>
    <circle cx="52" cy="36" r="3.2" fill="#15C7C0"/>
    <path d="M44 36 H49" stroke="#15C7C0" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <text x="92" y="58" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="800" fill="#E8EEF6" letter-spacing="0.5">Tru<tspan fill="url(#tf-lite-glow)">Flow</tspan></text>
  <!-- Lite pill -->
  <rect x="318" y="34" width="72" height="28" rx="9" fill="rgba(21,199,192,0.12)" stroke="rgba(21,199,192,0.45)" stroke-width="1"/>
  <text x="354" y="53" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#15C7C0" letter-spacing="2.5">LITE</text>
</svg>
