<!doctype html>
<html lang="en-ZA" data-app="proplens">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>PropLens — Property Capture</title>
    <meta
      name="description"
      content="Guided property photography, inspection reports and listing export for property professionals."
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- This is the bar above the app on Android and in an installed PWA. It was
         #4f46e5 — the indigo from before the cyan rebrand — so the phone drew a
         block of the old brand colour directly above a near-black app. Matching
         the app's own base makes the system bar disappear into the page. -->
    <meta name="theme-color" content="#F3F0E7" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3F0E7" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="PropLens" />

    <!-- iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PropLens" />
    <link rel="apple-touch-icon" href="/icons/PL-AppIcon.svg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/PL-AppIcon.svg" />

    <!-- Open Graph (share link to install) -->
    <meta property="og:title" content="PropLens" />
    <meta property="og:description" content="Property photo capture — shoot, report, export." />
    <meta property="og:type" content="website" />

    <style>
      /* Instant dark shell while JS loads */
      html, body, #root {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #06080D;
        color: #f5f5f5;
      }
      /* Safe areas for notched phones when installed */
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
