<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TruSaaS · 3D Listing Viewer</title>
  <style>
    :root {
      --bg: #0B1220; --ink: #E8EEF6; --muted: #8BA0B8; --accent: #15C7C0;
      --danger: #F0555A; --warn: #E7B24B; --blue: #3B82F6; --line: rgba(255,255,255,.1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: transparent; color: var(--ink); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 12px; }
    .stage {
      position: relative; aspect-ratio: 16/10; border-radius: 20px; overflow: hidden; touch-action: none; user-select: none;
      background:
        radial-gradient(ellipse at 50% 85%, rgba(21,199,192,.14), transparent 50%),
        linear-gradient(180deg, #121c2e 0%, #0B1220 100%);
      border: 1px solid var(--line);
      cursor: grab;
    }
    .stage.dragging { cursor: grabbing; }
    .stage img, .stage video {
      width: 100%; height: 100%; object-fit: contain; display: block; background: transparent;
      transition: opacity .12s ease;
    }
    .stage img.fading { opacity: .55; }
    .tag {
      position: absolute; transform: translate(-50%, -50%);
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff;
      cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.45);
      animation: pulse 2.2s ease-in-out infinite; z-index: 4;
    }
    .tag.info { background: var(--blue); }
    .tag.attention { background: var(--warn); }
    .tag.critical { background: var(--danger); }
    .tag.active { transform: translate(-50%,-50%) scale(1.25); box-shadow: 0 0 0 4px rgba(255,255,255,.2); }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,.35); }
      50% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
    }
    .popover {
      position: absolute; z-index: 6; min-width: 180px; max-width: min(280px, 86%);
      background: rgba(8,14,24,.96); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; font-size: 13px; box-shadow: 0 18px 40px rgba(0,0,0,.45);
      display: none; pointer-events: none;
    }
    .popover.on { display: block; animation: pop .16s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .popover .sev { font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
    .popover .sev.critical { color: var(--danger); }
    .popover .sev.attention { color: var(--warn); }
    .popover .sev.info { color: var(--blue); }
    .popover b { color: var(--accent); font-size: 11px; letter-spacing: .04em; }
    .popover .label { margin-top: 4px; line-height: 1.4; color: #E8EEF6; }
    .popover .thumb { margin-top: 8px; border-radius: 8px; overflow: hidden; max-height: 90px; }
    .popover .thumb img { width: 100%; height: 90px; object-fit: cover; display: block; }
    .controls {
      display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap;
    }
    .controls button {
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(15,24,38,.9); color: var(--ink); font-size: 18px; cursor: pointer;
    }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }
    .scrub-wrap { flex: 1; min-width: 160px; position: relative; height: 40px; display: flex; align-items: center; }
    input[type=range] {
      width: 100%; accent-color: var(--accent); height: 6px; cursor: pointer;
    }
    .play {
      padding: 0 14px !important; width: auto !important; font-size: 12px !important; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase;
    }
    .play.on { background: rgba(21,199,192,.15); border-color: var(--accent); color: var(--accent); }
    .meta { font-size: 12px; color: var(--muted); margin-top: 10px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .meta strong { color: var(--ink); }
    .legend { display: flex; gap: 12px; font-size: 10px; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .err { color: var(--danger); padding: 28px; text-align: center; }
    .hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: rgba(232,238,246,.55);
      background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 999px; pointer-events: none; z-index: 3;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="root"><div class="meta">Loading 3D package…</div></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const listing = params.get('listing') || '';
    const api = params.get('api') || `/api/public/web3d/${encodeURIComponent(listing)}`;
    const root = document.getElementById('root');

    function severityClass(s) {
      return s === 'critical' ? 'critical' : s === 'attention' ? 'attention' : 'info';
    }

    async function main() {
      if (!listing && !params.get('api')) {
        root.innerHTML = '<div class="err">Missing ?listing=STK-…</div>';
        return;
      }
      const res = await fetch(api, { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || !data.package) {
        root.innerHTML = `<div class="err">${data.error || 'Package not found. Export web 3D from TruLens Report first.'}</div>`;
        return;
      }
      const pkg = data.package;
      const frames = pkg.frames || [];
      let idx = 0;
      let playing = false;
      let playTimer = null;
      let dragX = null;

      root.innerHTML = `
        <div class="stage" id="stage">
          ${pkg.video?.src
            ? `<video id="media" src="${pkg.video.src}" muted playsinline loop></video>`
            : `<img id="media" alt="spin" draggable="false" />`}
          <div id="tags"></div>
          <div class="popover" id="pop"></div>
          <div class="hint" id="hint">Drag to spin · tap pins for damage</div>
        </div>
        <div class="controls">
          <button id="prev" type="button" aria-label="Previous">‹</button>
          <button id="play" type="button" class="play">Play</button>
          <div class="scrub-wrap">
            <input id="scrub" type="range" min="0" max="${Math.max(frames.length - 1, 0)}" value="0" step="1" />
          </div>
          <button id="next" type="button" aria-label="Next">›</button>
        </div>
        <div class="meta" id="meta"></div>
        <div class="legend">
          <span><i style="background:#3B82F6"></i>Info</span>
          <span><i style="background:#E7B24B"></i>Attention</span>
          <span><i style="background:#F0555A"></i>Critical</span>
          <span>${pkg.damageTags?.length || 0} tags · ${frames.length} frames</span>
        </div>
      `;

      const stage = document.getElementById('stage');
      const media = document.getElementById('media');
      const scrub = document.getElementById('scrub');
      const pop = document.getElementById('pop');
      const tagsEl = document.getElementById('tags');
      const meta = document.getElementById('meta');
      const playBtn = document.getElementById('play');
      const hint = document.getElementById('hint');

      function stopPlay() {
        playing = false;
        playBtn.classList.remove('on');
        playBtn.textContent = 'Play';
        if (playTimer) clearInterval(playTimer);
        playTimer = null;
      }

      function showFrame(i, instant) {
        if (!frames.length) return;
        idx = ((i % frames.length) + frames.length) % frames.length;
        scrub.value = String(idx);
        if (media.tagName === 'IMG') {
          if (!instant) media.classList.add('fading');
          const apply = () => {
            media.src = frames[idx].image;
            media.classList.remove('fading');
          };
          if (instant) apply();
          else setTimeout(apply, 40);
        }
        const az = frames[idx].azimuth;
        tagsEl.innerHTML = '';
        (pkg.damageTags || []).forEach((t) => {
          const d = Math.min(Math.abs(t.azimuth - az), 1 - Math.abs(t.azimuth - az));
          if (d > 0.14) return;
          const el = document.createElement('button');
          el.type = 'button';
          el.className = 'tag ' + severityClass(t.severity);
          el.style.left = (18 + (t.azimuth * 64)) + '%';
          el.style.top = (22 + t.elevation * 52) + '%';
          el.title = t.label;
          el.onclick = (ev) => {
            ev.stopPropagation();
            document.querySelectorAll('.tag').forEach((x) => x.classList.remove('active'));
            el.classList.add('active');
            pop.className = 'popover on';
            // Position near tag
            const rect = stage.getBoundingClientRect();
            const left = Math.min(Math.max(el.offsetLeft, 90), rect.width - 100);
            const top = Math.min(Math.max(el.offsetTop + 18, 40), rect.height - 80);
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';
            pop.style.transform = 'none';
            pop.innerHTML = `
              <div class="sev ${severityClass(t.severity)}">${t.severity || 'info'}</div>
              <b>Damage / note</b>
              <div class="label">${t.label}</div>
              ${t.thumb ? `<div class="thumb"><img src="${t.thumb}" alt=""></div>` : ''}
            `;
            hint.style.display = 'none';
          };
          tagsEl.appendChild(el);
        });
        meta.innerHTML = `
          <span><strong>${pkg.property.year} ${pkg.property.make} ${pkg.property.model}</strong> · ${pkg.listingRef}</span>
          <span>Frame ${idx + 1}/${frames.length} · ${pkg.background || 'original'}</span>
        `;
      }

      document.getElementById('prev').onclick = () => { stopPlay(); showFrame(idx - 1); };
      document.getElementById('next').onclick = () => { stopPlay(); showFrame(idx + 1); };
      scrub.oninput = () => { stopPlay(); showFrame(Number(scrub.value), true); };
      playBtn.onclick = () => {
        if (playing) { stopPlay(); return; }
        if (!frames.length) return;
        playing = true;
        playBtn.classList.add('on');
        playBtn.textContent = 'Pause';
        playTimer = setInterval(() => showFrame(idx + 1, true), 380);
      };

      // Drag to scrub
      const onDown = (x) => { dragX = x; stage.classList.add('dragging'); stopPlay(); pop.className = 'popover'; };
      const onMove = (x) => {
        if (dragX == null || !frames.length) return;
        const dx = x - dragX;
        if (Math.abs(dx) > 18) {
          showFrame(idx + (dx > 0 ? -1 : 1), true);
          dragX = x;
          hint.style.display = 'none';
        }
      };
      const onUp = () => { dragX = null; stage.classList.remove('dragging'); };
      stage.addEventListener('pointerdown', (e) => { if (e.target.classList?.contains('tag')) return; stage.setPointerCapture(e.pointerId); onDown(e.clientX); });
      stage.addEventListener('pointermove', (e) => onMove(e.clientX));
      stage.addEventListener('pointerup', onUp);
      stage.addEventListener('pointercancel', onUp);
      stage.addEventListener('click', (e) => {
        if (e.target.classList?.contains('tag')) return;
        pop.className = 'popover';
      });

      if (frames.length) showFrame(0, true);
      else {
        meta.innerHTML = `<span><strong>${pkg.listingRef}</strong> · video mode</span><span>${pkg.damageTags?.length || 0} tags</span>`;
        if (media.tagName === 'VIDEO') media.controls = true;
      }
    }
    main().catch((e) => { root.innerHTML = `<div class="err">${e.message}</div>`; });
  </script>
</body>
</html>
