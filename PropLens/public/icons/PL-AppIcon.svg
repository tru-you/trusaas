<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>

    <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#depth)">
    <text x="178" y="352" 
          font-family="'Inter Tight', Inter, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-size="232" 
          fill="url(#silver)" 
          text-anchor="middle"
          letter-spacing="-4">P</text>

    <text x="340" y="352" 
          font-family="'Inter Tight', Inter, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-size="232" 
          fill="url(#cyan)" 
          text-anchor="middle"
          letter-spacing="-4">L</text>
  </g>
</svg>