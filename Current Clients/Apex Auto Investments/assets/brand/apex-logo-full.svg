<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="m-left" x1="25" y1="25" x2="100" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="m-right" x1="175" y1="25" x2="100" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="terra-core" x1="100" y1="50" x2="100" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8611A"/>
      <stop offset="100%" stop-color="#9C4411"/>
    </linearGradient>
    <linearGradient id="text-metal" x1="220" y1="40" x2="760" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#09090b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Emblem Mark -->
    <g transform="translate(10, 0)">
      <path d="M100 20 L30 160 L68 160 L100 85 Z" fill="url(#m-left)" stroke="#1E293B" stroke-width="1"/>
      <path d="M100 20 L170 160 L132 160 L100 85 Z" fill="url(#m-right)" stroke="#0F172A" stroke-width="1"/>
      <path d="M100 55 L58 145 L72 145 L100 90 L128 145 L142 145 Z" fill="url(#terra-core)"/>
      <path d="M100 20 L100 85" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- Typography: APEX -->
    <text x="210" y="128" font-family="'Space Grotesk', 'Manrope', -apple-system, sans-serif" font-weight="800" font-size="96" letter-spacing="6" fill="url(#text-metal)" stroke="#0F172A" stroke-width="1.5">APEX</text>

    <!-- Subtitle: WHOLESALE INVESTMENTS -->
    <text x="215" y="162" font-family="'IBM Plex Mono', 'Space Grotesk', monospace" font-weight="700" font-size="20" letter-spacing="8" fill="#C2652A">WHOLESALE INVESTMENTS</text>
  </g>
</svg>
