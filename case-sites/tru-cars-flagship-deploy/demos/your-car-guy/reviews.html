<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reviews & Location — Your Car Guy</title>
<meta name="description" content="5.0 stars · 498 Google reviews · 17 Burt Drive, Newton Park, Gqeberha · Your Car Guy pre-owned vehicles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020202;--signal:#DF1D1D;--signal-bright:#F04444;--signal-dim:#8B1111;
  --text:#E8E8E8;--muted:#6B7280;--gold:#FBBF24;
  --glass:rgba(255,255,255,.03);--glass-hi:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.06);--border-hi:rgba(223,29,29,.18);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(223,29,29,.06),transparent 60%);
}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* ── Glass base ─────────────────────────────────────── */
.glass{
  background:var(--glass);backdrop-filter:blur(28px) saturate(1.3);
  border:1px solid var(--border);border-radius:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 4px 40px rgba(0,0,0,.6);
}

/* ── Rating hero ────────────────────────────────────── */
.rating-hero{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:14px 28px;flex-wrap:wrap;margin:36px auto 28px;
  background:rgba(255,255,255,.035);backdrop-filter:blur(28px) saturate(1.3);
  border:1px solid rgba(255,255,255,.07);border-radius:60px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 4px 32px rgba(0,0,0,.5);
  width:fit-content;
}
.gbp-avatar{
  width:44px;height:44px;border-radius:50%;object-fit:contain;
  border:2px solid rgba(223,29,29,.25);flex-shrink:0;
  box-shadow:0 0 16px rgba(223,29,29,.12);background:#111;
}
.big-stars{display:flex;gap:2px;flex-shrink:0}
.big-stars svg{width:22px;height:22px}
.rating-num{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1}
.rating-num em{font-style:normal;color:var(--signal-bright)}
.rating-num span{color:var(--muted);font-weight:600}
.rating-sub{color:var(--muted);font-size:13px}
.rating-sub strong{color:var(--text);font-weight:700}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0}

/* ── Shimmer ────────────────────────────────────────── */
.rating-hero{position:relative;overflow:hidden}
.rating-hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.1) 50%,transparent 70%);
  animation:shine 4s ease-in-out infinite;pointer-events:none;
}
@keyframes shine{0%,100%{transform:translateX(-120%)}50%{transform:translateX(120%)}}
.big-stars svg{filter:drop-shadow(0 0 4px rgba(251,191,36,.4));animation:starPulse 3s ease-in-out infinite}
.big-stars svg:nth-child(2){animation-delay:.15s}
.big-stars svg:nth-child(3){animation-delay:.3s}
.big-stars svg:nth-child(4){animation-delay:.45s}
.big-stars svg:nth-child(5){animation-delay:.6s}
@keyframes starPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(251,191,36,.3))}50%{filter:drop-shadow(0 0 10px rgba(251,191,36,.7))}}

/* ── Layout: map + info ─────────────────────────────── */
.loc-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:32px;perspective:1000px}
@media(min-width:720px){.loc-grid{grid-template-columns:1.4fr 1fr}}
.map-wrap{
  border-radius:20px;overflow:hidden;border:1px solid var(--border);
  height:300px;position:relative;
  box-shadow:0 8px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(223,29,29,.06);
  transform:rotateY(1.5deg);transition:transform .4s var(--ease);
}
.map-wrap:hover{transform:rotateY(0)}
.map-wrap iframe{width:100%;height:100%;border:0;filter:invert(0.94) hue-rotate(180deg) saturate(0.4) brightness(0.75) contrast(1.2)}
.map-wrap::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  border-radius:20px;
  box-shadow:inset 0 0 60px rgba(0,0,0,.4);
}
.info-card{
  padding:22px;display:flex;flex-direction:column;gap:14px;
  transform:rotateY(-1.5deg);transition:transform .4s var(--ease);
}
.info-card:hover{transform:rotateY(0)}
.info-row{display:flex;align-items:center;gap:11px;font-size:13px}
.info-icon{
  width:32px;height:32px;border-radius:8px;
  background:rgba(223,29,29,.08);border:1px solid rgba(223,29,29,.12);
  display:grid;place-items:center;flex-shrink:0;
}
.info-icon svg{width:14px;height:14px;stroke:var(--signal-bright);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.info-label{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:1px}
.info-val{font-weight:600;font-size:13px}
.info-val a{color:var(--text);text-decoration:none;transition:color .15s}
.info-val a:hover{color:var(--signal-bright)}

/* ── Photo strip ────────────────────────────────────── */
.photo-strip{
  display:flex;gap:10px;overflow-x:auto;padding:0 0 24px;
  scrollbar-width:thin;scrollbar-color:rgba(223,29,29,.2) transparent;
  -webkit-overflow-scrolling:touch;perspective:800px;
}
.photo-strip::-webkit-scrollbar{height:4px}
.photo-strip::-webkit-scrollbar-thumb{background:rgba(223,29,29,.2);border-radius:4px}
.photo-card{
  flex:0 0 220px;height:150px;border-radius:16px;overflow:hidden;
  border:1px solid var(--border);position:relative;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
  transition:transform .3s var(--ease),border-color .3s;
}
.photo-card:hover{transform:translateY(-4px) scale(1.02);border-color:var(--border-hi)}
.photo-card img{width:100%;height:100%;object-fit:cover;display:block}
.photo-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.6));
  pointer-events:none;
}

/* ── Google link ────────────────────────────────────── */
.gbp-link{
  text-align:center;padding:4px 0 40px;
}
.gbp-link a{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;
  padding:8px 16px;border-radius:10px;border:1px solid var(--border);
  background:var(--glass);transition:color .2s,border-color .2s;
}
.gbp-link a:hover{color:var(--signal-bright);border-color:var(--border-hi)}
.gbp-link a svg{width:14px;height:14px;fill:currentColor}

footer{border-top:1px solid var(--border);padding:16px 0 28px;font-size:10px;color:var(--muted);text-align:center}
</style>
</head>
