[build]
  publish = "."

[[edge_functions]]
  path = "/vehicle"
  function = "vehicle-og"

[[edge_functions]]
  path = "/vehicle/*"
  function = "vehicle-og"

[[edge_functions]]
  path = "/vehicle.html"
  function = "vehicle-og"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
