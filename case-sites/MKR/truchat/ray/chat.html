<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Chat with Ray · Your Car Guy</title>
  <meta name="description" content="Chat with Ray at Your Car Guy — stock, test drives, trade-ins. Newton Park, Port Elizabeth." />
  <meta name="theme-color" content="#08090f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #07080e;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(227,6,19,.28), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 100%, rgba(232,185,35,.06), transparent 50%),
        radial-gradient(circle at 50% 100%, #111425 0%, #07080e 55%);
      color: #f8fafc;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(7,8,14,.82); backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img {
      width: 46px; height: 46px; object-fit: contain; border-radius: 12px;
      background: #fff; padding: 4px;
      box-shadow: 0 8px 20px -10px rgba(227,6,19,.5);
    }
    .brand h1 {
      font-family: "Plus Jakarta Sans", sans-serif; font-size: 17px; font-weight: 800;
      color: #e30613; line-height: 1.15; letter-spacing: -.02em;
    }
    .brand p { font-size: 11px; color: #94a3b8; }
    .badge {
      font-size: 11px; font-weight: 700; color: #fff;
      border: 1px solid rgba(255,255,255,.22); padding: 7px 12px; border-radius: 999px;
      white-space: nowrap; background: rgba(255,255,255,.08);
    }
    .main {
      flex: 1; width: 100%; max-width: 480px; margin: 0 auto;
      padding: 14px 12px 8px; display: flex; flex-direction: column; min-height: 0;
    }
    #chatMount {
      flex: 1; min-height: 440px; height: min(740px, calc(100dvh - 110px));
      filter: drop-shadow(0 24px 48px rgba(0,0,0,.35));
    }
    .hint {
      text-align: center; font-size: 11px; color: #64748b; padding: 10px 12px 18px;
    }
    .hint a { color: #94a3b8; font-weight: 600; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img id="logo" src="assets/ycg-icon.jpg" alt="Your Car Guy" width="46" height="46" />
      <div>
        <h1>YOUR CAR GUY</h1>
        <p>Chat with Ray · Newton Park PE</p>
      </div>
    </div>
    <div class="badge" id="hoursBadge">Hours…</div>
  </header>

  <main class="main">
    <div id="chatMount"></div>
  </main>
  <p class="hint">Prefer WhatsApp? <a id="waLink" href="#">083 465 9921</a> · Powered by TruChat</p>

  <script src="../shared/qualifier.js"></script>
  <script src="../shared/chat-core.js"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      var CFG = window.RAY_TRUCHAT_CONFIG;
      var phone = String(CFG.personalWhatsApp || CFG.salesWhatsApp || "").replace(/\D/g, "");
      var wa = document.getElementById("waLink");
      if (phone) {
        wa.href = "https://wa.me/" + phone;
        wa.textContent = "0" + phone.slice(2);
      }
      (function resolveLogo() {
        var p = CFG.logoUrl || CFG.fabIconUrl || "assets/ycg-icon.jpg";
        try {
          p = new URL(p, location.href).href;
        } catch (e) {}
        CFG.logoUrl = p;
        document.getElementById("logo").src = p;
      })();

      function updateHours() {
        var now = new Date();
        var day = now.getDay();
        var mins = now.getHours() * 60 + now.getMinutes();
        var open = false;
        if (day >= 1 && day <= 5) open = mins >= 450 && mins <= 1050;
        if (day === 6) open = mins >= 450 && mins <= 780;
        var el = document.getElementById("hoursBadge");
        el.textContent = open ? "Showroom open" : "After hours · online";
        el.style.color = open ? "#34d399" : "#fff";
      }
      updateHours();
      setInterval(updateHours, 30000);

      window.TruChatUI.mount(document.getElementById("chatMount"), {
        config: CFG,
        showFoot: false,
      });
    })();
  </script>
</body>
</html>
