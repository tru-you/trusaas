<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TruSaaS · 3D Stock Viewer</title>
  <style>
    :root { --bg:#0B1220; --ink:#E8EEF6; --muted:#8BA0B8; --accent:#15C7C0; --danger:#F0555A; --warn:#E7B24B; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background: transparent; color: var(--ink); }
    .wrap { max-width: 920px; margin: 0 auto; padding: 12px; }
    .stage {
      position: relative; aspect-ratio: 16/10; border-radius: 18px; overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 80%, rgba(21,199,192,.12), transparent 55%),
        linear-gradient(180deg, #101a2b 0%, #0B1220 100%);
      border: 1px solid rgba(255,255,255,.08);
    }
    .stage img, .stage video {
      width: 100%; height: 100%; object-fit: contain; display: block;
      /* helps “backgroundless” PNGs sit cleanly on any site */
      background: transparent;
    }
    .tag {
      position: absolute; transform: translate(-50%,-50%);
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid #fff; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4);
      animation: pulse 2s ease-in-out infinite;
    }
    .tag.info { background: #3B82F6; }
    .tag.attention { background: var(--warn); }
    .tag.critical { background: var(--danger); }
    @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,.35);} 50%{ box-shadow:0 0 0 8px rgba(255,255,255,0);} }
    .popover {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      background: rgba(8,14,24,.92); border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; padding: 10px 14px; max-width: 90%; font-size: 13px;
      display: none; z-index: 5;
    }
    .popover.on { display: block; }
    .popover b { color: var(--accent); }
    .controls { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
    input[type=range] { flex:1; min-width: 160px; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .err { color: var(--danger); padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="root"><div class="meta">Loading 3D package…</div></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const stock = params.get('stock') || '';
    const api = params.get('api') || `/api/public/web3d/${encodeURIComponent(stock)}`;
    const root = document.getElementById('root');

    function severityClass(s) {
      return s === 'critical' ? 'critical' : s === 'attention' ? 'attention' : 'info';
    }

    async function main() {
      if (!stock && !params.get('api')) {
        root.innerHTML = '<div class="err">Missing ?stock=STK-…</div>';
        return;
      }
      const res = await fetch(api, { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || !data.package) {
        root.innerHTML = `<div class="err">${data.error || 'Package not found'}</div>`;
        return;
      }
      const pkg = data.package;
      const frames = pkg.frames || [];
      let idx = 0;
      let activeTag = null;

      root.innerHTML = `
        <div class="stage" id="stage">
          ${pkg.video?.src
            ? `<video id="media" src="${pkg.video.src}" muted playsinline controls></video>`
            : `<img id="media" alt="spin" />`}
          <div id="tags"></div>
          <div class="popover" id="pop"></div>
        </div>
        <div class="controls">
          <button id="prev" type="button">‹</button>
          <input id="scrub" type="range" min="0" max="${Math.max(frames.length - 1, 0)}" value="0" />
          <button id="next" type="button">›</button>
        </div>
        <div class="meta" id="meta"></div>
      `;

      const media = document.getElementById('media');
      const scrub = document.getElementById('scrub');
      const pop = document.getElementById('pop');
      const tagsEl = document.getElementById('tags');
      const meta = document.getElementById('meta');

      function showFrame(i) {
        if (!frames.length) return;
        idx = Math.max(0, Math.min(frames.length - 1, i));
        scrub.value = String(idx);
        if (media.tagName === 'IMG') media.src = frames[idx].image;
        const az = frames[idx].azimuth;
        // Tags near this azimuth
        tagsEl.innerHTML = '';
        (pkg.damageTags || []).forEach((t) => {
          const d = Math.min(Math.abs(t.azimuth - az), 1 - Math.abs(t.azimuth - az));
          if (d > 0.12) return;
          const el = document.createElement('button');
          el.type = 'button';
          el.className = 'tag ' + severityClass(t.severity);
          el.style.left = (20 + t.azimuth * 60) + '%';
          el.style.top = (25 + t.elevation * 50) + '%';
          el.title = t.label;
          el.onclick = () => {
            activeTag = t;
            pop.className = 'popover on';
            pop.innerHTML = `<b>Damage / note</b><div style="margin-top:4px">${t.label}</div>`;
          };
          tagsEl.appendChild(el);
        });
        meta.textContent = `${pkg.vehicle.year} ${pkg.vehicle.make} ${pkg.vehicle.model} · ${pkg.stockNumber} · frame ${idx + 1}/${frames.length} · ${pkg.damageTags?.length || 0} tags · ${pkg.background}`;
      }

      document.getElementById('prev').onclick = () => showFrame(idx - 1);
      document.getElementById('next').onclick = () => showFrame(idx + 1);
      scrub.oninput = () => showFrame(Number(scrub.value));
      document.getElementById('stage').onclick = (e) => {
        if (e.target.classList?.contains('tag')) return;
        pop.className = 'popover';
      };

      if (frames.length) showFrame(0);
      else meta.textContent = `${pkg.stockNumber} · video mode · ${pkg.damageTags?.length || 0} tags`;
    }
    main().catch((e) => { root.innerHTML = `<div class="err">${e.message}</div>`; });
  </script>
</body>
</html>
