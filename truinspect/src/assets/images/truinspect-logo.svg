<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <defs>
    <linearGradient id="inspect-glow" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4FE3DC"/>
      <stop offset="50%" stop-color="#4FE3DC"/>
      <stop offset="100%" stop-color="#4D9BFF"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4D8DD"/>
      <stop offset="50%" stop-color="#A8B0B8"/>
      <stop offset="100%" stop-color="#D4D8DD"/>
    </linearGradient>
    <filter id="neon-i">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Shield-check icon -->
  <g filter="url(#neon-i)" transform="translate(10, 8)">
    <!-- Shield outline -->
    <path d="M30 6 L50 14 L50 34 Q50 50 30 58 Q10 50 10 34 L10 14 Z" fill="none" stroke="url(#inspect-glow)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Checkmark inside -->
    <path d="M20 32 L27 39 L40 24" fill="none" stroke="#4FE3DC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- TRUINSPECT text -->
  <text x="72" y="50" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="2">
    <tspan fill="url(#silver)">Tru</tspan><tspan fill="url(#inspect-glow)">Inspect</tspan>
  </text>
</svg>
