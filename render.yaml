# TruSaaS — PRODUCT modules only (Render starter plan, always-on since 2026-07-21)
# Domain: trusaas.co.za
#
# Deploy these three:
#   trusaas-lens.onrender.com     → TruLens          (TruLens/)
#   trusaas-flow.onrender.com     → TruFlow Lite     (truflow-light)
#   trusaas-premium.onrender.com  → TruFlow Premium  (truflow-premium)
#
# STABILITY (see STABILITY.md):
#   - Services are on paid starter plan → always-on, no spin-down. Do NOT
#     revert plan to free: Blueprint sync would downgrade and bring back
#     30–60s cold starts.
#   - Keep-alive scripts retired (no longer needed on starter plan)
#   - Smoke: scripts/smoke-trusaas.ps1
#   - Health path MUST stay /api/health (JSON)
#
# PERSONAL (do NOT host as product):
#   index.html, truchat-*.html, trusaas_document_hub.html, marketing landing
#
# After deploy: Custom Domains on each service + DNS CNAMEs.

services:
  # ── 1. TruLens — guided capture / PWA / VIR ───────────────────────────────
  - type: web
    name: trusaas-lens
    runtime: node
    plan: starter
    rootDir: TruLens
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOCAL_MODE
        value: "1"
      # Default export target = Premium (MKR path). Change to flow URL if dealer is on Lite.
      - key: TRUFLOW_DMS_URL
        value: https://trusaas-premium.onrender.com  # live free host; custom domain later
      - key: GEMINI_API_KEY
        sync: false

  # ── 1b. TruInspect — AI damage detection / PDF inspection reports ─────────
  - type: web
    name: trusaas-inspect
    runtime: node
    plan: starter
    rootDir: truinspect
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOCAL_MODE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false

  # ── 2. TruFlow Lite — stock / leads / tasks ───────────────────────────────
  - type: web
    name: trusaas-flow
    runtime: node
    plan: starter
    rootDir: truflow-light
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false

  # ── 3. TruFlow Premium — full DMS / media / recon ─────────────────────────
  - type: web
    name: trusaas-premium
    runtime: node
    plan: starter
    rootDir: truflow-premium
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
