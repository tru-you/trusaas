# TruSaaS — PRODUCT modules only (Render starter plan, always-on since 2026-07-21)
# Domain: trusaas.co.za
#
# Services:
#   trusaas-lens.onrender.com     → TruLens          (TruLens/)
#   trusaas-inspect.onrender.com  → TruInspect       (truinspect)
#   trusaas-premium.onrender.com  → TruFlow          (truflow-premium)
#                                   → flow.tru-saas.com     (canonical)
#                                   → premium.tru-saas.com  (alias, legacy embeds)
#   trusaas-live.onrender.com     → TruLive          (trulive)  → live.tru-saas.com
#   trusaas-trade.onrender.com    → TruTrade + TruValue  (trutrade) → trade.tru-saas.com
#                                   (renamed from trusaas-value 2026-07-31; old service discontinued, domain repointed)
#
# TruFlow Lite (the old separate codebase) retired 2026-07-25. The current
# TruFlow Light console is a static client served by trusaas-premium at
# /light — it is NOT a service of its own; see §2.
#
# STABILITY (see STABILITY.md):
#   - Services are on paid starter plan → always-on, no spin-down. Do NOT
#     revert plan to free: Blueprint sync would downgrade and bring back
#     30–60s cold starts.
#   - Keep-alive scripts retired (no longer needed on starter plan)
#   - Smoke: scripts/smoke-trusaas.ps1
#   - Health path MUST stay /api/health (JSON)
#
# PERSONAL (do NOT host as product):
#   index.html, truchat-*.html, trusaas_document_hub.html, marketing landing
#
# After deploy: Custom Domains on each service + DNS CNAMEs.

services:
  # ── 1. TruLens — guided capture / PWA / VIR ───────────────────────────────
  - type: web
    name: trusaas-lens
    runtime: node
    plan: starter
    rootDir: TruLens
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Captures + web3d packages are written to disk. WITHOUT this, every deploy
    # or restart wipes the dealer's inventory back to the repo seed.
    disk:
      name: trulens-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOCAL_MODE
        value: "1"
      - key: DATA_DIR
        value: /var/data
      # REQUIRED. Without it the API accepts any bearer token — `Bearer zzz`
      # returned a dealer's captured vehicles and photos. Set the value in the
      # Render dashboard; this file only declares that it must exist.
      - key: TRULENS_ACCESS_CODE
        sync: false
      # Optional: pin the token signing key so device sessions survive a
      # code rotation. Derived from the access code when unset.
      - key: TRULENS_TOKEN_SECRET
        sync: false
      # Per-dealership codes: "cars-on-caledon:CODE1,mkr-autosales:CODE2".
      # A code here pins the dealership into the device token, so a capture
      # cannot file into another dealer's yard whichever way the picker is set.
      # TRULENS_ACCESS_CODE above still works and leaves the picker in charge.
      - key: TRULENS_DEALER_CODES
        sync: false
      # Shared secret for the photo push to TruFlow. MUST equal TRUFLOW_SYNC_KEY
      # on trusaas-premium. Set it HERE FIRST, then on TruFlow — this note used
      # to say the opposite, which is the order that breaks exports:
      #   TruLens sends the x-tru-sync-key header only when this is set.
      #   TruFlow leaves /api/sync/push-photos open while ITS key is unset.
      # So lens-then-flow has no failing window; flow-then-lens 401s every
      # export until lens restarts. Unset on both means anonymous writes.
      - key: TRUFLOW_SYNC_KEY
        sync: false
      # Default export target = Premium (MKR path). Change to flow URL if dealer is on Lite.
      - key: TRUFLOW_DMS_URL
        value: https://premium.tru-saas.com  # custom domain on Render (onrender host still works as fallback)
      - key: GEMINI_API_KEY
        sync: false

  # ── 1b. TruInspect — AI damage detection / PDF inspection reports ─────────
  - type: web
    name: trusaas-inspect
    runtime: node
    plan: starter
    rootDir: truinspect
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Inspections and their photos are written here. WITHOUT this the service
    # wrote to the container filesystem, so every deploy or restart discarded
    # every inspection a dealer had recorded — the same warning trusaas-lens
    # carries, which this service never got. The code also hardcoded ./data with
    # no DATA_DIR override, so mounting a disk alone would not have helped.
    disk:
      name: truinspect-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: LOCAL_MODE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false

  # ── 2. TruFlow Light — lightweight dealer console (NOT a separate service) ──
  #
  # Served by trusaas-premium at flow.tru-saas.com/light (server.ts mounts
  # express.static on public/light). It has no service block and no disk of its
  # own — it is a thin client that signs into the Premium API with a dealer
  # code. Deploy source is truflow-premium/public/light/index.html; the
  # maintained source of truth is truflow-light/index.html (one self-contained
  # file — edit there, then copy to public/light). Rebranded to the cyan suite
  # identity 2026-08-02, so it no longer ships the old blue "LITE" mark.
  # truflow-light/ is therefore NOT pending deletion.
  #
  # Do NOT confuse this with the old TruFlow *Lite* — a second full codebase
  # whose "login" was `password === '2026'` in client JS and which had no disk
  # (its seed cars kept reappearing). That tier was RETIRED 2026-07-25 and
  # removed outright rather than left commented, so a Blueprint sync cannot
  # resurrect it. There is one DMS product, TruFlow; Light is only its console.
  #
  # flow.tru-saas.com is a custom domain on trusaas-premium, so every dealer
  # embed already pointing at flow. keeps working. premium.tru-saas.com is kept
  # as an alias. flow. is the canonical hostname — use it in links, docs and
  # dealer training; logins are per-origin, so mixing the two logs people out.

  # ── 2b. TruView — live guided vehicle walkthrough (WebRTC, no app for buyer) ─
  - type: web
    name: trusaas-live
    runtime: node
    plan: starter
    rootDir: trulive
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # AI walkthrough summary (Claude). Optional — falls back to a structured
      # local summary if unset. Set the key in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRULIVE_MODEL
        value: claude-sonnet-5

  # ── 2c. TruTrade / TruValue — live video appraisal + self-guided instant offer
  #        trade.tru-saas.com · /truvalue.html for the consumer self-serve flow
  - type: web
    name: trusaas-trade
    runtime: node
    plan: starter
    rootDir: trutrade
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Condition write-up (Claude). Optional — falls back to a structured local
      # write-up. Never prices a vehicle; the dealer sets the TP.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRUTRADE_MODEL
        value: claude-sonnet-5

  # ── 3. TruFlow Premium — full DMS / media / recon / TruSocial ──────────────
  - type: web
    name: trusaas-premium
    runtime: node
    plan: starter
    rootDir: truflow-premium
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # data.json (all stock/leads/invoices) + portals.json live here. WITHOUT
    # this, every deploy or restart resets the DMS to the demo seed and the
    # dealer websites go back to showing nothing.
    disk:
      name: truflow-premium-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Gates /api/sync/push-photos. While unset the endpoint accepts
      # unauthenticated writes — anyone who knows the URL can push vehicles and
      # photos into a dealer's inventory. MUST equal TRUFLOW_SYNC_KEY on
      # trusaas-lens. Set it here first, then on TruLens.
      - key: TRUFLOW_SYNC_KEY
        sync: false
      # TruLens origin — used for sync-back (delete a capture when the DMS
      # vehicle is removed). Falls back to https://lens.tru-saas.com.
      - key: TRULENS_URL
        value: https://lens.tru-saas.com
      # Set once, at first boot on a fresh disk, to choose the master admin code
      # instead of reading a generated one out of the service log. Ignored
      # afterwards — rotate through /api/auth/codes/rotate.
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # ── TruSocial (Zernio integration) ──
      # Team-level API key from docs.zernio.com. Required for profile
      # provisioning, OAuth connect, and account sync.
      - key: ZERNIO_API_KEY
        sync: false
      # Optional webhook auth. Format: "HeaderName:secretvalue" — if set,
      # POST /api/integration/webhook-zernio checks this custom header.
      # If unset, the webhook endpoint accepts all POSTs (still validates
      # payload structure). Configure the matching header on Zernio's
      # webhook settings page.
      - key: ZERNIO_WEBHOOK_SECRET
        sync: false

  # ── 4. TruChat API — hosted Claude chat brain for static sites ────────────
  #   trusaas-chat.onrender.com → marketing bot + any HTML dealer embed.
  #   Zero npm deps (native Node http + fetch). Claude primary, WhatsApp/knowledge
  #   fallback if the key is missing/errors — degrades, never breaks.
  - type: web
    name: trusaas-chat
    runtime: node
    plan: starter
    rootDir: truchat-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # REQUIRED for the AI to answer — set the value in the Render dashboard.
      # Reuse the same funded key as TruLive/TruValue. Without it the bot still
      # runs (knowledge answers + WhatsApp handoff), just no free-form AI.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRUCHAT_MODEL
        value: claude-haiku-4-5
      # Market/locale — SA is launch; override per region to serve any market.
      - key: TRUCHAT_MARKET
        value: South Africa
      - key: TRUCHAT_LOCALE
        value: en-ZA
      - key: TRUCHAT_CURRENCY
        value: ZAR
      - key: STOCK_API
        value: https://premium.tru-saas.com/api/public/stock?dealer=true-cars
      - key: SALES_WHATSAPP
        value: "27620502091"
