# TruSaaS — PRODUCT modules only (Render starter plan, always-on since 2026-07-21)
# Domain: trusaas.co.za
#
# Services:
#   trusaas-lens.onrender.com     → TruLens          (TruLens/)
#   trusaas-inspect.onrender.com  → TruInspect       (truinspect)
#   trusaas-premium.onrender.com  → TruFlow          (truflow-premium)
#                                   → flow.tru-saas.com     (canonical)
#                                   → premium.tru-saas.com  (alias, legacy embeds)
#   trusaas-mobile.onrender.com   → TruFlow Mobile   (truflow-mobile) → app.tru-saas.com
#   trusaas-live.onrender.com     → TruLive          (trulive)  → live.tru-saas.com
#   trusaas-trade.onrender.com    → TruTrade + TruValue  (trutrade) → trade.tru-saas.com
#                                   (renamed from trusaas-value 2026-07-31; old service discontinued, domain repointed)
#   trusaas-arbitrage.onrender.com → TruRadar (packages/tru-arbitrage) → radar.tru-saas.com
#
# TruFlow Lite (the old separate codebase) retired 2026-07-25. The current
# TruFlow Light console is a static client served by trusaas-premium at
# /light — it is NOT a service of its own; see §2.
#
# STABILITY (see STABILITY.md):
#   - Services are on paid starter plan → always-on, no spin-down. Do NOT
#     revert plan to free: Blueprint sync would downgrade and bring back
#     30–60s cold starts.
#   - Keep-alive scripts retired (no longer needed on starter plan)
#   - Smoke: scripts/smoke-trusaas.ps1
#   - Health path MUST stay /api/health (JSON)
#
# PERSONAL (do NOT host as product):
#   index.html, truchat-*.html, trusaas_document_hub.html, marketing landing
#
# After deploy: Custom Domains on each service + DNS CNAMEs.

services:
  # ── 1. TruLens — guided capture / PWA / VIR ───────────────────────────────
  - type: web
    name: trusaas-lens
    runtime: node
    plan: starter
    rootDir: TruLens
    # Auto-deploy the moment TruLens/ changes; ignore commits that don't touch
    # it so a dealer's live app isn't restarted for unrelated marketing pushes.
    # (This is why the Aug-15 dropdown fix sat un-deployed — auto-deploy was off.)
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - TruLens/**
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Captures + web3d packages are written to disk. WITHOUT this, every deploy
    # or restart wipes the dealer's inventory back to the repo seed.
    disk:
      name: trulens-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOCAL_MODE
        value: "1"
      - key: DATA_DIR
        value: /var/data
      # REQUIRED. Without it the API accepts any bearer token — `Bearer zzz`
      # returned a dealer's captured vehicles and photos. Set the value in the
      # Render dashboard; this file only declares that it must exist.
      - key: TRULENS_ACCESS_CODE
        sync: false
      # Optional: pin the token signing key so device sessions survive a
      # code rotation. Derived from the access code when unset.
      - key: TRULENS_TOKEN_SECRET
        sync: false
      # Per-dealership codes: "cars-on-caledon:CODE1,mkr-autosales:CODE2".
      # A code here pins the dealership into the device token, so a capture
      # cannot file into another dealer's yard whichever way the picker is set.
      # TRULENS_ACCESS_CODE above still works and leaves the picker in charge.
      - key: TRULENS_DEALER_CODES
        sync: false
      # Prospects demo Lens too (same rationale as trusaas-inspect): with an
      # access code set, demo defaults OFF unless explicit. Demo sessions are
      # uid-isolated, capped, and never touch the Imagin8 gateway.
      - key: DEMO_ENABLED
        value: "1"
      # Shared secret for the photo push to TruFlow. MUST equal TRUFLOW_SYNC_KEY
      # on trusaas-premium. Set it HERE FIRST, then on TruFlow — this note used
      # to say the opposite, which is the order that breaks exports:
      #   TruLens sends the x-tru-sync-key header only when this is set.
      #   TruFlow leaves /api/sync/push-photos open while ITS key is unset.
      # So lens-then-flow has no failing window; flow-then-lens 401s every
      # export until lens restarts. Unset on both means anonymous writes.
      - key: TRUFLOW_SYNC_KEY
        sync: false
      # Default export target = Premium (MKR path). Change to flow URL if dealer is on Lite.
      - key: TRUFLOW_DMS_URL
        value: https://premium.tru-saas.com  # custom domain on Render (onrender host still works as fallback)
      - key: DEEPSEEK_API_KEY
        sync: false
      # Imagin8 / TransUnion eValue8. Platform calls need APIKey + customerId;
      # chargeable getValues/regCheck ALSO need the account login + registered
      # applicationName — same values across ALL apps (sync via an env group).
      - key: IMAGIN8_API_KEY
        sync: false
      - key: IMAGIN8_CUSTOMER_ID
        sync: false
      - key: IMAGIN8_USERNAME
        sync: false
      - key: IMAGIN8_PASSWORD
        sync: false
      - key: IMAGIN8_APP_NAME
        sync: false
      # Bright Data Web Unlocker — unblocks Cars.co.za (Cloudflare 403) so its
      # full __NEXT_DATA__ result set returns in ~2-5s. Key/zone set in dashboard.
      - key: SCRAPER_UNLOCKER_ENABLED
        value: "1"
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false

  # ── 1b. TruInspect — AI damage detection / PDF inspection reports ─────────
  - type: web
    name: trusaas-inspect
    runtime: node
    plan: starter
    rootDir: truinspect
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - truinspect/**
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Inspections and their photos are written here. WITHOUT this the service
    # wrote to the container filesystem, so every deploy or restart discarded
    # every inspection a dealer had recorded — the same warning trusaas-lens
    # carries, which this service never got. The code also hardcoded ./data with
    # no DATA_DIR override, so mounting a disk alone would not have helped.
    disk:
      name: truinspect-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: LOCAL_MODE
        value: "1"
      # Prospects demo Inspect more than any other app. With an access code set,
      # demo defaults OFF unless this is explicit — the whole Imagin8 gateway
      # design assumes prospect demos exist (they short-circuit locally, never
      # reach the gateway, spend nothing).
      - key: DEMO_ENABLED
        value: "1"
      # REQUIRED for sign-in. Without these the API rejects every login with
      # "No way to verify codes". TRUFLOW_SYNC_KEY verifies dealer codes against
      # TruFlow; TRUINSPECT_ACCESS_CODE is the legacy shared code. Values live in
      # the Render dashboard (sync: false), so a Blueprint sync must never drop them.
      - key: TRUFLOW_SYNC_KEY
        sync: false
      - key: TRUINSPECT_ACCESS_CODE
        sync: false
      - key: TRUINSPECT_TOKEN_SECRET
        sync: false
      # TruFlow DMS base URL — code verification (verifyCodeWithTruFlow) and
      # "Export to DMS" both call this. Defaults to localhost without it, which
      # breaks sign-in and exports in production.
      - key: TRUFLOW_DMS_URL
        value: https://premium.tru-saas.com
      - key: DEEPSEEK_API_KEY
        sync: false
      # Imagin8 / TransUnion eValue8. Platform calls (Makes/Models/StaticInfo)
      # need only APIKey + customerId. The chargeable per-call services
      # (getValues, regCheck) ALSO require the account login + a pre-registered
      # applicationName — without them Imagin8 returns an HTML error page and
      # the TU valuation fails ("<!DOCTYPE… not valid JSON"). Set all in the
      # dashboard, never commit them.
      - key: IMAGIN8_API_KEY
        sync: false
      - key: IMAGIN8_CUSTOMER_ID
        sync: false
      - key: IMAGIN8_USERNAME
        sync: false
      - key: IMAGIN8_PASSWORD
        sync: false
      - key: IMAGIN8_APP_NAME
        sync: false
      # Headless render worker (trusaas-crm-scraper): JS-heavy dealer pages
      # (WeBuyCars, CMH...) are rendered there; JSON dealers (Car Store,
      # McCarthy Toyota) answer via plain HTTP so most valuations skip the
      # worker entirely. Comma-separated list = round-robin + failover.
      - key: SCRAPER_SERVICE_URLS
        value: https://trusaas-crm-scraper.onrender.com
      # Bright Data Web Unlocker — unblocks Cars.co.za (Cloudflare 403) so its
      # full __NEXT_DATA__ result set returns in ~2-5s instead of a slow worker
      # render. Key/zone are set in the Render dashboard, never committed
      # (zone reuses the same value as TruCRM's BRIGHTDATA_UNLOCKER_ZONE).
      - key: SCRAPER_UNLOCKER_ENABLED
        value: "1"
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false

  # ── 2. TruFlow Mobile — standalone Premium companion app ────────────────────
  #
  # RETIRED: TruFlow Light (the /light PWA on Premium) was replaced by TruFlow
  # Mobile on 2026-08-14. Mobile runs as its own service at app.tru-saas.com
  # and proxies API calls to trusaas-premium. Premium's /light route now 301s
  # to app.tru-saas.com so existing bookmarks migrate automatically.
  #
  # Entry-level dealers can run entirely on the mobile app — it has leads,
  # inventory, docs, and add-vehicle. Premium dealers use both desktop + mobile.
  - type: web
    name: trusaas-mobile
    runtime: node
    plan: starter
    rootDir: truflow-mobile
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - truflow-mobile/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_TARGET
        value: https://flow.tru-saas.com
      - key: PORT
        value: "3002"

  # ── 2b. TruView — live guided vehicle walkthrough (WebRTC, no app for buyer) ─
  - type: web
    name: trusaas-live
    runtime: node
    plan: starter
    rootDir: trulive
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - trulive/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # AI walkthrough summary (Claude). Optional — falls back to a structured
      # local summary if unset. Set the key in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRULIVE_MODEL
        value: claude-sonnet-5

  # ── 2c. TruTrade / TruValue — live video appraisal + self-guided instant offer
  #        trade.tru-saas.com · /truvalue.html for the consumer self-serve flow
  - type: web
    name: trusaas-trade
    runtime: node
    plan: starter
    rootDir: trutrade
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - trutrade/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Condition write-up (Claude). Optional — falls back to a structured local
      # write-up. Never prices a vehicle; the dealer sets the TP.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRUTRADE_MODEL
        value: claude-sonnet-5

  # ── 3. TruFlow Premium — full DMS / media / recon / TruSocial ──────────────
  - type: web
    name: trusaas-premium
    runtime: node
    plan: starter
    rootDir: truflow-premium
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - truflow-premium/**
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # data.json (all stock/leads/invoices) + portals.json live here. WITHOUT
    # this, every deploy or restart resets the DMS to the demo seed and the
    # dealer websites go back to showing nothing.
    disk:
      name: truflow-premium-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Gates /api/sync/push-photos. While unset the endpoint accepts
      # unauthenticated writes — anyone who knows the URL can push vehicles and
      # photos into a dealer's inventory. MUST equal TRUFLOW_SYNC_KEY on
      # trusaas-lens. Set it here first, then on TruLens.
      - key: TRUFLOW_SYNC_KEY
        sync: false
      # TruLens origin — used for sync-back (delete a capture when the DMS
      # vehicle is removed). Falls back to https://lens.tru-saas.com.
      - key: TRULENS_URL
        value: https://lens.tru-saas.com
      # TruRadar origin — the master-admin TruRadar tab proxies dealer
      # provisioning to the radar's registry through this URL with the sync
      # key. Falls back to https://trusaas-arbitrage.onrender.com.
      - key: TRU_RADAR_URL
        value: https://trusaas-arbitrage.onrender.com
      # Set once, at first boot on a fresh disk, to choose the master admin code
      # instead of reading a generated one out of the service log. Ignored
      # afterwards — rotate through /api/auth/codes/rotate.
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Imagin8 / TransUnion eValue8. Platform calls need APIKey + customerId;
      # chargeable getValues/regCheck ALSO need the account login + registered
      # applicationName — same values across ALL apps (sync via an env group).
      - key: IMAGIN8_API_KEY
        sync: false
      - key: IMAGIN8_CUSTOMER_ID
        sync: false
      - key: IMAGIN8_USERNAME
        sync: false
      - key: IMAGIN8_PASSWORD
        sync: false
      - key: IMAGIN8_APP_NAME
        sync: false
      # ── TruSocial (Zernio integration) ──
      # Team-level API key from docs.zernio.com. Required for profile
      # provisioning, OAuth connect, and account sync.
      - key: ZERNIO_API_KEY
        sync: false
      # Optional webhook auth. Format: "HeaderName:secretvalue" — if set,
      # POST /api/integration/webhook-zernio checks this custom header.
      # If unset, the webhook endpoint accepts all POSTs (still validates
      # payload structure). Configure the matching header on Zernio's
      # webhook settings page.
      - key: ZERNIO_WEBHOOK_SECRET
        sync: false
      # Bright Data Web Unlocker — unblocks Cars.co.za (Cloudflare 403) so its
      # full __NEXT_DATA__ result set returns in ~2-5s. Key/zone set in dashboard.
      - key: SCRAPER_UNLOCKER_ENABLED
        value: "1"
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false

  # ── 4. TruChat API — hosted DeepSeek chat brain for static sites ───────────
  #   trusaas-chat.onrender.com → marketing bot + any HTML dealer embed.
  #   Zero npm deps (native Node http + fetch). DeepSeek primary, WhatsApp/knowledge
  #   fallback if the key is missing/errors — degrades, never breaks.
  - type: web
    name: trusaas-chat
    runtime: node
    plan: starter
    rootDir: truchat-api
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - truchat-api/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # REQUIRED for the AI to answer — set the value in the Render dashboard.
      # Without it the bot still runs (knowledge answers + WhatsApp handoff),
      # just no free-form AI.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TRUCHAT_MODEL
        value: deepseek-chat
      # Market/locale — SA is launch; override per region to serve any market.
      - key: TRUCHAT_MARKET
        value: South Africa
      - key: TRUCHAT_LOCALE
        value: en-ZA
      - key: TRUCHAT_CURRENCY
        value: ZAR
      - key: STOCK_API
        value: https://premium.tru-saas.com/api/public/stock?dealer=true-cars
      - key: SALES_WHATSAPP
        value: "27620502091"

  # ── 5. TruCRM + Scraper — deployed from separate repo (TruCRM) ─────────────
  # Removed from this Blueprint — TruCRM lives in its own repository and is
  # deployed as its own Render service. Services: trusaas-crm, trusaas-crm-scraper.
  # Create them manually on Render pointing at the TruCRM repo.

  # ── 6. Market Value — public valuation webapp (cars + housing, any country) ──
  #   trusaas-market-value.onrender.com  →  the market-scraper webapp
  # Base for customers to run their own instance, each with their OWN Bright Data /
  # SERP keys set in the Render dashboard. No key = free path only (US/UK sites
  # 403 plain HTTP until BRIGHTDATA_API_KEY is added).
  - type: web
    name: trusaas-market-value
    runtime: node
    plan: starter
    rootDir: packages/market-scraper
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - packages/market-scraper/**
    buildCommand: npm install && npm run build:webapp
    startCommand: npm run start:webapp
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Bright Data Web Unlocker — unblocks US/UK classifieds (Autotrader.com,
      # Cars.com, AutoTrader.co.uk) so they return real listings. Key set in the
      # dashboard by the instance owner, never committed.
      - key: SCRAPER_UNLOCKER_ENABLED
        value: "1"
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false
      # Google SERP fallback tier (wide net when the free layers are thin).
      - key: SERP_API_KEY
        sync: false
      - key: SERP_PROVIDER
        sync: false
      - key: SERP_ZONE
        sync: false
      # Headless render workers (comma-separated) for JS-heavy sites.
      - key: SCRAPER_SERVICE_URLS
        sync: false

  # ── 7. TruRadar (TruArbitrage) — Vehicle Sourcing Radar ──────────────────
  #   trusaas-arbitrage.onrender.com  →  packages/tru-arbitrage
  #   Standalone buy-radar: confidence-gated classifieds + dealer-SERP deals,
  #   own JWT dealer auth, per-dealer data isolation, webhook-only alerts.
  #   (FB Marketplace lane retired 2026-08-28; own-stock gate dormant for the
  #   future Flow bolt-on.)
  - type: web
    name: trusaas-arbitrage
    runtime: node
    plan: starter
    rootDir: packages/tru-arbitrage
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - packages/tru-arbitrage/**
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: truarbitrage-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4500"
      - key: DATA_DIR
        value: /var/data
      # REQUIRED. Without it the dealer JWT layer falls back to a constant and
      # tokens are forgeable. Set the value in the Render dashboard.
      - key: JWT_SECRET
        sync: false
      # Shared secret with TruFlow — gates the dealer-registry admin routes and
      # the surgical TU valuation backstop (deducts the right dealer's bundle).
      - key: TRUFLOW_SYNC_KEY
        sync: false
      # Prospects demo the radar too (same doctrine as Lens/Inspect).
      - key: DEMO_ENABLED
        value: "1"
      - key: FLOW_PREMIUM_URL
        value: https://premium.tru-saas.com
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        value: tds2
      # Cloudflare-bypass switch. The free crawler is blocked on Cars.co.za/AutoTrader
      # (server fetch = 403); this forces the Web Unlocker path instead of relying on
      # the live comps coming through on a plain HTTP GET. Set to "1" in the dashboard.
      - key: SCRAPER_UNLOCKER_ENABLED
        value: "1"
      # Remote headless render worker (the SCRAPER_SERVICE_URLS the other apps use).
      # Without this the valuation crawler can't reach many marketplaces; set the
      # comma-separated worker URLs in the dashboard so valuation.ts + cars-autotrader.ts
      # can render pages past Cloudflare. sync: false so a Blueprint sync never drops them.
      - key: SCRAPER_SERVICE_URLS
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: SERP_PROVIDER
        value: brightdata
      # Zone name as created in the BrightData dashboard (SERP API type).
      - key: SERP_ZONE
        value: radar
      - key: GEMINI_API_KEY
        sync: false
      - key: MIN_ARBITRAGE_MARGIN
        value: "10000"
      # Dynamic recon — pct × market retail clamped to [floor, cap]
      - key: RECON_PCT
        value: "0.03"
      - key: RECON_FLOOR
        value: "5000"
      - key: RECON_CAP
        value: "30000"
      - key: STALE_FLOORPLAN_DAYS
        value: "40"


