# TruSaaS — PRODUCT modules only (Render free tier)
# Domain: trusaas.co.za
#
# Deploy these three:
#   trusaas-lens.onrender.com     → TruLens          (autolens-pro)
#   trusaas-flow.onrender.com     → TruFlow Lite     (truflow-light)
#   trusaas-premium.onrender.com  → TruFlow Premium  (truflow-premium)
#
# PERSONAL (do NOT host as product):
#   index.html, truchat-*.html, trusaas_document_hub.html, marketing landing
#   Keep in repo for you; not a public product service.
#
# After deploy: Custom Domains on each service + DNS CNAMEs.
# Free web services spin down after ~15 min idle (cold start ~30–60s).

services:
  # ── 1. TruLens — guided capture / PWA / VIR ───────────────────────────────
  - type: web
    name: trusaas-lens
    runtime: node
    plan: free
    rootDir: autolens-pro
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOCAL_MODE
        value: "1"
      # Default export target = Premium (MKR path). Change to flow URL if dealer is on Lite.
      - key: TRUFLOW_DMS_URL
        value: https://trusaas-premium.onrender.com  # live free host; custom domain later
      - key: GEMINI_API_KEY
        sync: false

  # ── 2. TruFlow Lite — stock / leads / tasks ───────────────────────────────
  - type: web
    name: trusaas-flow
    runtime: node
    plan: free
    rootDir: truflow-light
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false

  # ── 3. TruFlow Premium — full DMS / media / recon ─────────────────────────
  - type: web
    name: trusaas-premium
    runtime: node
    plan: free
    rootDir: truflow-premium
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
