<!doctype html>
<html lang="en" data-app="propinspect" data-tier="premium">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         numbers. Without it the insets are all 0, so the black-translucent
         status bar below drew the app *under* the notch and the home indicator
         sat on top of the sidebar's log-out button. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PropInspect</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
      <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F3F0E7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PropInspect" />
    <link rel="icon" href="/icons/PI-AppIcon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/PI-AppIcon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
