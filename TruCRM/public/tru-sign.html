<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TruDocs · Sign this document</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F5F1E8; --paper-2:#EDE6D8; --paper-card:#FBF8F1;
    --ink:#12202B; --ink-2:#3A4553; --muted:#8A8172; --faint:#A69C8D;
    --line:rgba(18,32,43,.14); --line-soft:rgba(18,32,43,.08);
    --cyan:#07889B; --cyan-bright:#0891A6; --cyan-soft:rgba(7,136,155,.12); --cyan-faint:rgba(7,136,155,.06);
    --green:#2F7D5B; --green-soft:rgba(47,125,91,.12);
    --danger:#B86A6A;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
    --sign:'Caveat',cursive;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.55; letter-spacing:-0.005em;
    -webkit-font-smoothing:antialiased; padding:0 0 80px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .wash{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(60% 40% at 80% -10%,rgba(7,136,155,.06),transparent 65%);}

  .toolbar{
    position:sticky;top:0;z-index:20;background:rgba(245,241,232,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;
  }
  .brand{display:flex;align-items:center;gap:8px;margin-right:auto;}
  .brand .mark{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    background:var(--cyan-faint);border:1px solid var(--cyan-soft);color:var(--cyan);font-family:var(--mono);font-size:11px;font-weight:600;}
  .brand b{font-weight:600;font-size:14px;}
  .brand span{color:var(--muted);font-size:12px;margin-left:2px;}
  .btn{font:inherit;font-size:13px;font-weight:500;cursor:pointer;border-radius:8px;padding:8px 14px;
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper-card);color:var(--ink-2);
    transition:border-color .15s,color .15s,background .15s;font-family:var(--sans);}
  .btn:hover{color:var(--ink);border-color:var(--cyan);}
  .btn.primary{background:var(--cyan);color:#fff;border-color:transparent;}
  .btn.primary:hover{background:var(--cyan-bright);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn:disabled:hover{color:var(--ink-2);border-color:var(--line);background:var(--paper-card);}

  .sheet-wrap{position:relative;z-index:1;max-width:900px;margin:20px auto 0;padding:0 20px;}
  .doc{
    background:#fff;
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 18px 50px -20px rgba(18,32,43,.12);
    padding:42px 44px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  .logo{font-weight:600;font-size:24px;letter-spacing:-0.02em;line-height:1;font-family:var(--sans);}
  .logo .tru{color:var(--ink);}
  .logo .dealer{color:var(--cyan);}
  .logo-tag{font-size:11px;color:var(--muted);letter-spacing:0.06em;margin-top:3px;font-family:var(--mono);text-transform:uppercase;}

  .head{display:flex;justify-content:space-between;gap:28px;align-items:flex-start;flex-wrap:wrap;}
  .biz .bn{font-size:16px;font-weight:600;color:var(--ink);margin-top:12px;}
  .biz .sub{font-size:13px;color:var(--ink-2);margin-top:2px;}
  .biz .addr{font-size:13px;color:var(--ink-2);margin-top:6px;white-space:pre-line;}
  .doc-title{text-align:right;}
  .doc-title h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em;color:var(--cyan);}
  .doc-meta{margin-top:12px;font-size:13px;color:var(--muted);text-align:right;}
  .doc-meta .row{display:flex;justify-content:flex-end;gap:8px;align-items:baseline;margin-bottom:3px;}
  .doc-meta .row label{min-width:96px;text-align:right;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;}
  .doc-meta .row b{font-family:var(--mono);font-weight:500;color:var(--ink);}

  .parties{display:flex;gap:40px;margin:30px 0 20px;flex-wrap:wrap;}
  .party{flex:1;min-width:220px;}
  .party h4{margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-family:var(--mono);}
  .party .name{font-weight:600;}
  .party .addr{font-size:13.5px;color:var(--ink-2);white-space:pre-line;}

  table.items{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;}
  table.items thead th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    padding:9px 8px;border-bottom:1px solid var(--line);font-family:var(--mono);}
  table.items th.num,table.items td.num{text-align:right;white-space:nowrap;}
  table.items tbody td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  table.items td.num{font-family:var(--mono);}
  table.items tbody tr:last-child td{border-bottom:none;}
  .std-cols,.sla-cols,.money-col{display:none;}
  body[data-mode="quote"] .std-cols, body[data-mode="invoice"] .std-cols{display:table-cell;}
  body[data-mode="quote"] .money-col, body[data-mode="invoice"] .money-col{display:table-cell;}
  body[data-mode="sla"] .sla-cols{display:table-cell;}

  .totals{display:flex;justify-content:flex-end;margin-top:14px;}
  .totals .box{width:290px;}
  .totals .line{display:flex;justify-content:space-between;align-items:baseline;padding:6px 8px;font-size:14px;}
  .totals .line .lbl{color:var(--muted);}
  .totals .line .val{font-family:var(--mono);color:var(--ink);}
  .totals .line.grand{border-top:1px solid var(--line);margin-top:4px;padding-top:12px;font-size:16px;font-weight:600;}
  .totals .line.grand .val{color:var(--cyan);}

  .scope{margin-top:22px;}
  .scope h4{margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-family:var(--mono);}
  .scope p{margin:0;font-size:13.5px;color:var(--ink-2);white-space:pre-line;}

  .foot{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:40px;flex-wrap:wrap;}
  .foot .col{flex:1;min-width:220px;}
  .foot h4{margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-family:var(--mono);}
  .foot p{margin:0;font-size:13px;color:var(--ink-2);white-space:pre-line;}

  .sign-panel{margin-top:34px;border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--paper-card);}
  .sign-panel h3{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--ink);}
  .sign-panel .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .sign-grid{display:flex;gap:16px;flex-wrap:wrap;}
  .sign-field{flex:1;min-width:160px;}
  .sign-field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-family:var(--mono);margin-bottom:4px;}
  .sign-field input{width:100%;font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line-soft);border-radius:8px;padding:9px 12px;background:#fff;outline:none;}
  .sign-field input:focus{border-color:var(--cyan);}
  .pad-wrap{position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;height:110px;overflow:hidden;margin-top:14px;}
  .pad-wrap canvas{display:block;width:100%;height:110px;touch-action:none;cursor:crosshair;}
  .pad-wrap .pad-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);
    font-family:var(--sign);font-size:26px;pointer-events:none;}
  .pad-wrap.inked .pad-ph{display:none;}
  .pad-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;flex-wrap:wrap;}
  .pad-hint{font-size:12px;color:var(--faint);}

  .status-banner{margin-top:34px;border-radius:14px;padding:20px;background:var(--green-soft);border:1px solid rgba(47,125,91,.25);}
  .status-banner h3{margin:0 0 4px;font-size:16px;font-weight:600;color:var(--green);}
  .status-banner p{margin:0;font-size:13px;color:var(--ink-2);}
  .status-banner .sig-preview{margin-top:12px;height:64px;}
  .status-banner .sig-preview img{height:100%;width:auto;}

  .error-banner{margin:40px auto 0;max-width:520px;text-align:center;}
  .error-banner h1{font-size:20px;}
  .error-banner p{color:var(--muted);font-size:14px;}

  .thanks{margin-top:26px;text-align:center;font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;}

  @media print{
    @page{ margin:0; size:auto; }
    html,body{ margin:0; padding:0; background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .toolbar,.wash,.sign-panel .sub,.pad-row,.sign-field input,.pad-wrap{border-color:var(--line) !important;}
    .toolbar{display:none !important;}
    .sign-panel{background:#fff !important;}
    .sheet-wrap{max-width:none;margin:0;padding:10mm;}
    .doc{box-shadow:none !important;border:1.5pt solid var(--paper-2) !important;border-radius:12px !important;padding:14mm !important;background:#fff !important;}
    .sign-field input{background:transparent !important;}
  }
</style>
</head>
<body data-mode="invoice">
<div class="wash"></div>

<div class="toolbar">
  <div class="brand"><span class="mark">Tru</span><b>TruDocs</b><span>· Signing</span></div>
  <button class="btn" id="btnPrint" style="display:none;">Print / Save PDF</button>
</div>

<div class="sheet-wrap">
  <div class="doc" id="doc" style="display:none;"></div>

  <div class="error-banner" id="errorBox" style="display:none;">
    <h1>Document not found</h1>
    <p>The link may have expired or been revoked. Please ask the sender for a new link.</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var id = new URLSearchParams(location.search).get("id") || "";
  var doc = null;

  var MODES={
    quote:  {title:"Quote",   noLabel:"Quote no.",   due:"Valid until", to:"Prepared for", grand:"Quote total", footL:"Banking details"},
    invoice:{title:"Invoice", noLabel:"Invoice no.", due:"Due",         to:"Bill to",      grand:"Total due",   footL:"Banking details"},
    sla:    {title:"Service Level Agreement", noLabel:"Agreement no.", due:"Renews", to:"Between TruDealer and", grand:"", footL:"Support contacts"}
  };

  function num(v){v=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isFinite(v)?v:0;}
  function money(n){return (doc.currency||"R")+" "+n.toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function blank(s){return esc(s).trim()===""?"—":esc(s);}

  function fmtDate(iso){ if(!iso) return ""; try{ return new Date(iso).toLocaleDateString("en-ZA",{year:"numeric",month:"short",day:"numeric"}); }catch(e){ return iso; } }

  function render(){
    document.body.setAttribute("data-mode",doc.mode);
    var m=MODES[doc.mode]||MODES.invoice;
    var f=doc.fields||{};

    var sub=0;
    var rowsHtml=(doc.rows||[]).map(function(r){
      var a=num(r.qty)*num(r.price); sub+=a;
      var std='<td class="std-cols">'+blank(r.desc)+'</td>'
        +'<td class="num money-col std-cols">'+esc(r.qty==null||r.qty===""?"1":r.qty)+'</td>'
        +'<td class="num money-col std-cols">'+money(num(r.price))+'</td>'
        +'<td class="num money-col std-cols">'+money(a)+'</td>';
      var sla='<td class="sla-cols">'+blank(r.desc)+'</td>'
        +'<td class="sla-cols">'+blank(r.commit)+'</td>'
        +'<td class="num sla-cols">'+blank(r.target)+'</td>';
      return "<tr>"+(doc.mode==="sla"?sla:std)+"</tr>";
    }).join("");

    var vat=sub*num(doc.vat)/100;
    var grand=sub+vat;

    var totalsHtml = doc.mode==="sla" ? "" :
      '<div class="totals"><div class="box">'
      +'<div class="line"><span class="lbl">Subtotal</span><span class="val">'+money(sub)+'</span></div>'
      +'<div class="line"><span class="lbl">VAT '+esc(doc.vat)+'%</span><span class="val">'+money(vat)+'</span></div>'
      +'<div class="line grand"><span class="lbl">'+esc(m.grand)+'</span><span class="val">'+money(grand)+'</span></div>'
      +'</div></div>';

    var scopeHtml = doc.mode==="sla"
      ? '<div class="scope"><h4>Scope &amp; coverage</h4><p>'+blank(f.scope)+'</p></div>' : "";

    document.getElementById("doc").innerHTML =
      '<div class="head">'
      +'<div class="biz">'
      +'<div class="logo"><span class="tru">Tru</span><span class="dealer">Dealer</span></div>'
      +'<div class="logo-tag">'+esc(doc.fields.bizName||"")+'</div>'
      +'<div class="bn">'+blank(f.bizName)+'</div>'
      +'<div class="sub">'+blank(f.bizReg)+'</div>'
      +'<div class="addr">'+blank(f.bizAddr)+'</div>'
      +'</div>'
      +'<div class="doc-title"><h1>'+m.title+'</h1>'
      +'<div class="doc-meta">'
      +'<div class="row"><label>'+m.noLabel+'</label><b>'+blank(f.docNo)+'</b></div>'
      +'<div class="row"><label>Date</label><b>'+fmtDate(f.docDate)+'</b></div>'
      +'<div class="row"><label>'+m.due+'</label><b>'+fmtDate(f.dueDate)+'</b></div>'
      +'</div></div></div>'
      +'<div class="parties">'
      +'<div class="party"><h4>'+m.to+'</h4><div class="name">'+blank(f.clientName)+'</div><div class="addr">'+blank(f.clientAddr)+'</div></div>'
      +'<div class="party"><h4>Reference</h4><div class="addr">'+blank(f.ref)+'</div><div class="addr" style="margin-top:4px;">'+blank(f.vehicle)+'</div></div>'
      +'</div>'
      +'<table class="items"><thead><tr>'
      +'<th class="std-cols" style="width:50%">Description</th>'
      +'<th class="num money-col std-cols" style="width:12%">Qty</th>'
      +'<th class="num money-col std-cols" style="width:18%">Unit price</th>'
      +'<th class="num money-col std-cols" style="width:18%">Amount</th>'
      +'<th class="sla-cols" style="width:38%">Service area</th>'
      +'<th class="sla-cols" style="width:28%">Commitment</th>'
      +'<th class="num sla-cols" style="width:18%">Target</th>'
      +'</tr></thead><tbody>'+rowsHtml+'</tbody></table>'
      +totalsHtml
      +scopeHtml
      +'<div class="foot">'
      +'<div class="col"><h4>'+m.footL+'</h4><p>'+blank(f.bank)+'</p></div>'
      +'<div class="col"><h4>Notes / terms</h4><p>'+blank(f.notes)+'</p></div>'
      +'</div>'
      +signPanelHtml()
      +'<div class="thanks">'+esc(doc.fields.bizName||"TruDealer")+' · '+esc(doc.docNo||"")+'</div>';

    document.getElementById("doc").style.display="block";
  }

  function signPanelHtml(){
    if(doc.signed){
      return '<div class="status-banner">'
        +'<h3>✓ Signed by '+esc(doc.signed.name)+'</h3>'
        +'<p>Signed '+fmtDate(doc.signed.signedAt)+'. Thank you — this document is complete.</p>'
        +'<div class="sig-preview"><img src="'+esc(doc.signed.signature)+'" alt="Signature" /></div>'
        +'</div>';
    }
    return '<div class="sign-panel">'
      +'<h3>Sign to accept</h3>'
      +'<p class="sub">Draw your signature below (finger or mouse), then submit. You are agreeing to the terms of this '+esc(MODES[doc.mode].title.toLowerCase())+'.</p>'
      +'<div class="sign-grid">'
      +'<div class="sign-field"><label>Full name</label><input id="sigName" placeholder="Your full name" /></div>'
      +'<div class="sign-field"><label>Date</label><input id="sigDate" type="date" /></div>'
      +'</div>'
      +'<div class="pad-wrap" id="padWrap"><span class="pad-ph">sign here</span><canvas id="pad"></canvas></div>'
      +'<div class="pad-row"><span class="pad-hint">Mouse or finger — sign exactly as you would on paper.</span>'
      +'<button class="btn" id="btnClear">Clear</button></div>'
      +'<div style="margin-top:16px;display:flex;justify-content:flex-end;"><button class="btn primary" id="btnSign">Sign &amp; submit</button></div>'
      +'</div>';
  }

  var drawing=false, last=null;
  function initPad(){
    var wrap=document.getElementById("padWrap"), c=document.getElementById("pad"), ctx=c.getContext("2d");
    function size(){
      var r=wrap.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
      c.width=r.width*dpr; c.height=r.height*dpr; ctx.scale(dpr,dpr);
      ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#07889B";
    }
    size();
    function pos(e){var r=c.getBoundingClientRect();var p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top};}
    function start(e){drawing=true;last=pos(e);wrap.classList.add("inked");e.preventDefault();}
    function move(e){if(!drawing)return;var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault();}
    function end(){drawing=false;}
    c.addEventListener("pointerdown",start); c.addEventListener("pointermove",move);
    window.addEventListener("pointerup",end);
    document.getElementById("btnClear").addEventListener("click",function(){ctx.clearRect(0,0,c.width,c.height);wrap.classList.remove("inked");});
    document.getElementById("btnSign").addEventListener("click",submitSig);
  }

  function submitSig(){
    var c=document.getElementById("pad"), wrap=document.getElementById("padWrap");
    var name=document.getElementById("sigName").value.trim();
    var btn=document.getElementById("btnSign");
    if(!wrap.classList.contains("inked")){ alert("Please draw your signature in the box above."); return; }
    if(!name){ alert("Please enter your full name."); return; }
    btn.disabled=true; btn.textContent="Submitting…";
    var signature=c.toDataURL("image/png");
    fetch("/esig/sign",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ id:id, name:name, signature:signature })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(!res.ok) throw new Error(res.j.error||"Signing failed");
      doc.signed={ name:name, signature:signature, signedAt:res.j.signedAt };
      render();
      document.getElementById("btnPrint").style.display="inline-flex";
    }).catch(function(e){
      btn.disabled=false; btn.textContent="Sign & submit";
      alert(e.message||"Could not submit your signature. Please check your connection and try again.");
    });
  }

  if(!id){
    document.getElementById("errorBox").style.display="block";
  } else {
    fetch("/esig/doc?id="+encodeURIComponent(id))
      .then(function(r){
        if(!r.ok) throw new Error("not found");
        return r.json();
      })
      .then(function(d){
        doc=d;
        render();
        if(!doc.signed){ initPad(); }
        document.getElementById("btnPrint").style.display=doc.signed?"inline-flex":"none";
        document.getElementById("btnPrint").onclick=function(){ window.print(); };
      })
      .catch(function(){
        document.getElementById("errorBox").style.display="block";
      });
  }
})();
</script>
</body>
</html>
