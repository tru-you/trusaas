services:
  - type: web
    name: trucrm
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/data
      - key: TRUCRM_ACCESS_CODE
        sync: false
        value: ""
      - key: DEEPSEEK_API_KEY
        sync: false
        value: ""
      - key: ENABLE_HEADLESS
        sync: false
        value: ""
    disk:
      name: trucrm-data
      mountPath: /opt/render/project/data
      sizeGB: 5
