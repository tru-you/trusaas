<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" fill="none">
  <defs>
    <linearGradient id="inspect-glow" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Inspect crown icon (matches TruInspect.jpg style) -->
  <g filter="url(#neon)" transform="translate(10, 8)">
    <!-- U shape base -->
    <path d="M10 18 Q10 52 30 52 Q50 52 50 18" fill="none" stroke="url(#inspect-glow)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Crown diamonds - slightly different arrangement -->
    <rect x="14" y="4" width="8" height="8" rx="1.5" transform="rotate(45 18 8)" fill="#C084FC"/>
    <rect x="22" y="0" width="8" height="8" rx="1.5" transform="rotate(45 26 4)" fill="#A855F7"/>
    <rect x="30" y="4" width="8" height="8" rx="1.5" transform="rotate(45 34 8)" fill="#C084FC"/>
    <!-- Checkmark inside U -->
    <path d="M22 35 L28 41 L40 27" fill="none" stroke="#15C7C0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Tru Inspect text -->
  <text x="75" y="50" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="34" font-weight="700" fill="#E8EEF6" letter-spacing="1">Tru <tspan fill="url(#inspect-glow)">Inspect</tspan></text>
</svg>
