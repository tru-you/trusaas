services:
  - type: web
    name: trusaas-trade
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
        value: ""
      - key: TURN_URL
        sync: false
        value: ""
      - key: TURN_USERNAME
        sync: false
        value: ""
      - key: TURN_CREDENTIAL
        sync: false
        value: ""
