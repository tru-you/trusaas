
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
    <defs>
      <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="30%" stop-color="#CBD5E1"/>
        <stop offset="65%" stop-color="#64748B"/>
        <stop offset="100%" stop-color="#0F172A"/>
      </linearGradient>
      <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#E0F2FE"/>
        <stop offset="30%" stop-color="#38BDF8"/>
        <stop offset="65%" stop-color="#0088FF"/>
        <stop offset="100%" stop-color="#002266"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="12" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
    <g transform="translate(300, 300)">
      <circle cx="0" cy="0" r="210" fill="none" stroke="#0088FF" stroke-width="12" filter="url(#glow)"/>
      <circle cx="-55" cy="-45" r="55" fill="url(#chrome)"/>
      <circle cx="55" cy="45" r="55" fill="url(#blue)" filter="url(#glow)"/>
      <path d="M-55 -15 Q0 -45 55 15 L55 75 Q0 45 -55 15 Z" fill="url(#blue)"/>
    </g>
  </svg>
