<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" fill="none" role="img" aria-label="TruFlow Light">
  <!-- TruSaaS suite wordmark — same language as truflow-premium-logo.svg,
       tier badge reads LIGHT. Cyan brand; retired blue orbit + chrome mark. -->
  <defs>
    <linearGradient id="tf-lt-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FE3DC"/>
      <stop offset="40%" stop-color="#4FE3DC"/>
      <stop offset="70%" stop-color="#1466E0"/>
      <stop offset="100%" stop-color="#15C7C0"/>
    </linearGradient>
    <linearGradient id="tf-lt-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="tf-lt-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#tf-lt-soft)" transform="translate(8,12)">
    <circle cx="36" cy="36" r="34" fill="url(#tf-lt-glow)" opacity="0.2"/>
    <circle cx="36" cy="36" r="28" fill="rgba(15,24,38,0.55)" stroke="url(#tf-lt-glow)" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="28" fill="url(#tf-lt-glass)"/>
    <path d="M22 36 L36 18 L50 36 L36 54 Z" fill="none" stroke="url(#tf-lt-glow)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M30 36 L36 28 L42 36 L36 44 Z" fill="url(#tf-lt-glow)" opacity="0.95"/>
    <circle cx="52" cy="36" r="3.2" fill="#7FF0EA"/>
    <path d="M44 36 H49" stroke="#7FF0EA" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <text x="92" y="58" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="38" font-weight="800" fill="#E8EEF6" letter-spacing="0.5">Tru<tspan fill="url(#tf-lt-glow)">Flow</tspan></text>
  <rect x="318" y="34" width="112" height="28" rx="9" fill="rgba(79,227,220,0.12)" stroke="rgba(79,227,220,0.5)" stroke-width="1"/>
  <text x="374" y="53" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#7FF0EA" letter-spacing="2">LIGHT</text>
</svg>
