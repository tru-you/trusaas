<!-- ===== QUALIFIER ENGINE (local keyword bot) ===== -->
<script>
(function (root) {
  "use strict";

  function createSession() {
    return {
      name: "Prospect",
      phone: "",
      vehicleInterest: "Browsing",
      tradeInDetails: "",
      testDriveDate: "",
      inspectionDate: "",
      financeInterest: false,
      pathway: [],
      stage: "idle",
      qualified: false,
    };
  }

  function createQualifier(config) {
    const cfg = Object.assign(
      {
        assistantName: "Assistant",
        dealerName: "Showroom",
        address: "",
        hoursText: "",
        salesWhatsApp: "",
        catalog: [],
        brandMap: {},
        workingDays: 6,
        skipSunday: true,
        weekdaySlots: ["09:00 AM", "11:00 AM", "02:00 PM", "04:00 PM"],
        saturdaySlots: ["08:30 AM", "10:00 AM", "11:30 AM"],
      },
      config || {}
    );

    let session = createSession();

    function log(action) {
      const t = new Date().toLocaleTimeString("en-ZA", { hour: "2-digit", minute: "2-digit" });
      session.pathway.push({ action: action, time: t });
    }

    function getWorkingDays() {
      const days = [];
      const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const d = new Date();
      while (days.length < cfg.workingDays) {
        d.setDate(d.getDate() + 1);
        if (cfg.skipSunday && d.getDay() === 0) continue;
        days.push({
          label: dayNames[d.getDay()] + " " + d.getDate() + " " + monthNames[d.getMonth()],
          isSaturday: d.getDay() === 6,
          iso: d.toISOString().slice(0, 10),
        });
      }
      return days;
    }

    function slotsFor(isSaturday) {
      return isSaturday ? cfg.saturdaySlots : cfg.weekdaySlots;
    }

    function matchCatalog(text) {
      const lower = String(text || "").toLowerCase();
      const map = cfg.brandMap || {};
      for (const key of Object.keys(map)) {
        if (lower.includes(key)) {
          const brand = map[key];
          return cfg.catalog.filter(function (c) {
            return String(c.brand).toUpperCase() === String(brand).toUpperCase();
          });
        }
      }
      return cfg.catalog.filter(function (c) {
        const blob = (c.brand + " " + c.model).toLowerCase();
        return lower.split(/\s+/).some(function (w) {
          return w.length > 3 && blob.includes(w);
        });
      });
    }

    function isQualified() {
      const hasPhone = !!session.phone;
      const hasIntent =
        (session.vehicleInterest && session.vehicleInterest !== "Browsing") ||
        !!session.tradeInDetails ||
        !!session.testDriveDate ||
        !!session.inspectionDate;
      return hasPhone && hasIntent;
    }

    function recomputeQualified() {
      session.qualified = isQualified();
      return session.qualified;
    }

    function process(text) {
      const raw = String(text || "").trim();
      const lower = raw.toLowerCase();
      const replies = [];

      function say(t, suggestions) {
        replies.push({ type: "text", text: t, suggestions: suggestions || [] });
      }

      log('Client: "' + raw + '"');

      const phoneMatched = raw.match(/(?:\+27|0)\d{9}/);
      if (phoneMatched) {
        session.phone = phoneMatched[0];
        log("Saved phone: " + session.phone);
        recomputeQualified();
        say(
          "Thanks — I've logged **" + session.phone + "**. " +
            (session.qualified
              ? "You're all set; our team will follow up on WhatsApp shortly."
              : "One of the team will follow up on WhatsApp.") +
            (session.qualified ? "\n\n--- Lead qualified ---" : ""),
          ["Browse stock", "Trade-in", "Hours"]
        );
        return { replies: replies, session: session, handoffReady: session.qualified };
      }

      const nameMatched = raw.match(/(?:my name is|i am|i'm|call me)\s+([a-zA-Z\s]{2,20})/i);
      if (nameMatched) {
        session.name = nameMatched[1].trim();
        log("Name: " + session.name);
        say("Nice to meet you, **" + session.name + "**. How can I help?", [
          "Browse stock", "I have a trade-in", "Book test drive",
        ]);
        return { replies: replies, session: session };
      }

      if (/^\s*(hi+|hey+|hello|howzit|hallo|yo|greetings|good\s+(morning|afternoon|evening|day))[\s!.,]*$/i.test(raw)) {
        say(
          "Hi there! I'm **" + (cfg.assistantName || "your assistant") + "** at **" + cfg.dealerName +
            "**. I can help with **stock**, **test drives**, **trade-in valuations**, **finance**, or **hours**. What are you after?",
          ["Browse stock", "Trade-in valuation", "Book test drive", "Finance help"]
        );
        return { replies: replies, session: session };
      }

      if (/^\s*(thanks?|thank\s+you|thank\s+u|cheers|much\s+appreciated|dankie|lekker)[\s!.,]*$/i.test(raw)) {
        say("Pleasure! Anything else I can sort — stock, finance, or a test drive?", [
          "Browse stock", "Finance help", "Book test drive",
        ]);
        return { replies: replies, session: session };
      }

      if (lower.includes("address") || lower.includes("location") || lower.includes("where") ||
          lower.includes("hours") || lower.includes("open")) {
        say(
          (cfg.address ? "**" + cfg.address + "**\n\n" : "") + (cfg.hoursText || "Please ask the team for hours."),
          ["Browse stock", "Trade-in"]
        );
        return { replies: replies, session: session };
      }

      if (lower.includes("catalog") || lower.includes("stock") || lower.includes("inventory") ||
          lower.includes("cars") || lower.includes("browse")) {
        say("Here's a selection from the floor right now:");
        replies.push({ type: "catalog", vehicles: cfg.catalog.slice() });
        return { replies: replies, session: session };
      }

      if (lower.includes("trade-in") || lower.includes("trade in") || lower.includes("sell my car") ||
          lower.includes("valuation")) {
        session.stage = "trade_await_specs";
        session.tradeInDetails = "Awaiting input...";
        say("We buy pre-owned daily.\n\nPlease send: **Year, Make, Model, Mileage & condition**.");
        return { replies: replies, session: session };
      }

      if (session.stage === "trade_await_specs" || session.tradeInDetails === "Awaiting input...") {
        session.tradeInDetails = raw;
        session.stage = "idle";
        log("Trade-in specs: " + raw);
        say("Thanks — got those details. Pick a showroom valuation slot:");
        replies.push({ type: "schedule", scheduleType: "inspection", days: getWorkingDays() });
        return { replies: replies, session: session };
      }

      if (lower.includes("yes") && (lower.includes("finance") || session.financeInterest)) {
        session.financeInterest = true;
        log("Finance interest confirmed");
        say("Great — finance can run a soft assessment. Please share your **mobile number** so we can continue on WhatsApp.", []);
        return { replies: replies, session: session };
      }

      if (lower.includes("finance") || lower.includes("financ") || lower.includes("afford") ||
          lower.includes("instal") || lower.includes("repayment") || lower.includes("deposit") ||
          lower.includes("credit")) {
        session.financeInterest = true;
        log("Finance interest");
        say(
          "We arrange **vehicle finance** through the major banks on our approved pre-owned stock.\n\nShare your **mobile number** and I'll have the finance desk start a soft, no-obligation assessment on WhatsApp.",
          ["Browse stock", "Book test drive"]
        );
        return { replies: replies, session: session };
      }

      const matches = matchCatalog(raw);
      if (matches.length) {
        session.vehicleInterest = matches[0].brand + " " + matches[0].model;
        log("Matched: " + session.vehicleInterest);
        say("I found these on the floor:");
        replies.push({ type: "catalog", vehicles: matches });
        return { replies: replies, session: session };
      }

      const alts = ["mercedes", "merc", "benz", "bmw", "isuzu", "nissan", "kia", "hyundai"];
      const alt = alts.find(function (b) { return lower.includes(b); });
      if (alt) {
        say("No **" + alt.toUpperCase() + "** units showing right now — interested in these instead?");
        replies.push({ type: "catalog", vehicles: cfg.catalog.slice(0, 2) });
        return { replies: replies, session: session };
      }

      say(
        "I can help with **stock**, **test drives**, **trade-in valuations**, **finance**, or **showroom hours**.\n\nWhat would you like?",
        ["Browse stock", "Trade-in valuation", "Finance help", "Showroom hours"]
      );
      return { replies: replies, session: session };
    }

    function selectVehicleAction(vehicleLabel, action) {
      const replies = [];
      session.vehicleInterest = vehicleLabel;
      if (action === "finance") {
        session.financeInterest = true;
        log("Finance query: " + vehicleLabel);
        replies.push({
          type: "text",
          text: "Estimating terms for **" + vehicleLabel + "**…\n\nTypical terms are 60–72 months. Want our finance desk to start a preliminary assessment?",
          suggestions: ["Yes, help with finance", "Book test drive instead"],
        });
      } else {
        log("Test drive: " + vehicleLabel);
        replies.push({ type: "text", text: "Let's book a viewing for the **" + vehicleLabel + "**.\n\nPick a date:", suggestions: [] });
        replies.push({ type: "schedule", scheduleType: "test_drive", days: getWorkingDays() });
      }
      return { replies: replies, session: session };
    }

    function confirmSlot(scheduleType, dateLabel, timeLabel) {
      const replies = [];
      const stamp = dateLabel + " @ " + timeLabel;
      if (scheduleType === "test_drive") {
        session.testDriveDate = stamp;
        log("Test drive: " + stamp);
        replies.push({ type: "text", text: "Booked **test drive** for **" + stamp + "**" + (cfg.address ? " at " + cfg.address : "") + ".\n\nPlease send your **phone number** to complete.", suggestions: [] });
      } else {
        session.inspectionDate = stamp;
        log("Inspection: " + stamp);
        replies.push({ type: "text", text: "Valuation slot confirmed for **" + stamp + "**.\n\nDrop your **phone number** to finalise.", suggestions: [] });
      }
      recomputeQualified();
      return { replies: replies, session: session };
    }

    function buildTicket() {
      let msg = "LIVE TICKET — " + cfg.dealerName.toUpperCase() + "\n\n";
      msg += "Client: " + session.name + "\n";
      msg += "Phone: " + (session.phone || "Not provided") + "\n";
      msg += "Interest: " + session.vehicleInterest + "\n";
      if (session.financeInterest) msg += "Finance: Interested\n";
      msg += "\n";
      if (session.testDriveDate) msg += "Test drive: " + session.testDriveDate + "\n\n";
      if (session.tradeInDetails) {
        msg += "Trade-in: " + session.tradeInDetails + "\n";
        if (session.inspectionDate) msg += "Valuation: " + session.inspectionDate + "\n\n";
      }
      msg += "Pathway:\n";
      session.pathway.forEach(function (step, idx) {
        msg += (idx + 1) + ". [" + step.time + "] " + step.action + "\n";
      });
      msg += "\nQualified: " + (session.qualified ? "YES" : "pending phone/intent");
      msg += "\n\n— sent via TruChat by TruSaaS";
      return msg;
    }

    function whatsappHandoffUrl() {
      const phone = String(cfg.salesWhatsApp || "").replace(/\D/g, "");
      const text = encodeURIComponent(buildTicket());
      return "https://api.whatsapp.com/send?phone=" + phone + "&text=" + text;
    }

    function reset() { session = createSession(); return session; }
    function getSession() { return session; }
    function setCatalog(list) { cfg.catalog = list || []; }

    return {
      process, selectVehicleAction, confirmSlot, getWorkingDays, slotsFor,
      buildTicket, whatsappHandoffUrl, getSession, reset, setCatalog, recomputeQualified,
      config: cfg,
    };
  }

  root.TruChatQualifier = { createQualifier, createSession };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script>
(function (root) {

      "--tc-bg:#08090f;--tc-panel:rgba(16,18,28,.92);--tc-border:rgba(255,255,255,.1);--tc-text:#f8fafc;",
      "--tc-muted:#94a3b8;--tc-green:#34d399;--tc-user:rgba(227,6,19,.2);",
      "--tc-ease:cubic-bezier(.22,1,.36,1);--tc-spring:cubic-bezier(.34,1.56,.64,1);",
      "font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--tc-text);box-sizing:border-box;",
      "-webkit-font-smoothing:antialiased}",

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function detectVehicleFromPage() { return ""; }

  function loadLeads(lsKey) {
    try { return JSON.parse(localStorage.getItem(lsKey || DEFAULT_LS_KEY) || "[]"); } catch (e) { return []; }
  }

  function saveLeadEntry(entry, lsKey) {
    var key = lsKey || DEFAULT_LS_KEY;
    var list = loadLeads(key);
    if (list[0] && list[0].source === "chat" &&
        ((entry.phone && list[0].phone === entry.phone) ||
         (!entry.phone && list[0].name === entry.name && Date.now() - new Date(list[0].at).getTime() < 2 * 3600 * 1000))) {
      list[0] = entry;
    } else { list.unshift(entry); }
    localStorage.setItem(key, JSON.stringify(list.slice(0, 50)));
  }

      '<div class="tc-composer"><input id="tcIn" type="text" placeholder="Ask about stock, finance, trade-in…" autocomplete="off" enterkeyhint="send" />' +
      '<button type="button" id="tcSend">Send</button></div>' +
      (options.showFoot !== false ? '<div class="tc-foot">' + esc(CFG.brandLine||CFG.dealerName||'') +
      (CFG.showCredit === false ? '' : ' · <span>TruChat</span> by TruSaaS') + '</div>' : '') +
      '</div>';

    if (CFG.logoUrl) container.querySelector("#tcAv").innerHTML = '<img src="' + esc(CFG.logoUrl) + '" alt="" />';

    var histEl = container.querySelector("#tcHist");
    var typingEl = container.querySelector("#tcTyping");
    var input = container.querySelector("#tcIn");
    var waBar = container.querySelector("#tcWaBar");
    var lastSavedSig = "";
    var destroyed = false;
    var handoffPrompted = false;

    function setTyping(on, label) {
      if (on) {
        typingEl.classList.add("is-on");
        var t = typingEl.querySelector(".tc-typing-txt");
        if (t) t.textContent = label || (waSkin ? "typing…" : (CFG.assistantName||"Assistant") + " is typing");
      } else {
        typingEl.classList.remove("is-on");
        var t2 = typingEl.querySelector(".tc-typing-txt");
        if (t2) t2.textContent = "";
      }
    }

    function persistLead(force) {
      var s = bot.getSession();
      var hasSignal = force || s.qualified || (s.phone && s.phone.length > 5) ||
        (s.tradeInDetails && s.tradeInDetails !== "Awaiting input...") || s.testDriveDate || s.inspectionDate ||
        (s.vehicleInterest && s.vehicleInterest !== "Browsing");
      if (!hasSignal) return;
      var sig = [s.name,s.phone,s.vehicleInterest,s.qualified,s.testDriveDate,s.inspectionDate].join("|");
      if (!force && sig === lastSavedSig) return;
      lastSavedSig = sig;
      var entry = { at: new Date().toISOString(), name: s.name, phone: s.phone,
        vehicleInterest: s.vehicleInterest, tradeInDetails: s.tradeInDetails,
        testDriveDate: s.testDriveDate, inspectionDate: s.inspectionDate,
        financeInterest: s.financeInterest, qualified: s.qualified,
        ticket: bot.buildTicket(), source: "chat", session: JSON.parse(JSON.stringify(s)) };
      saveLeadEntry(entry, LS_KEY);
    }

    function addBotText(text, suggestions) {
      var div = document.createElement("div");
      div.className = "tc-msg bot";
      div.innerHTML = esc(text).replace(/\n/g,"<br>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
      if (suggestions && suggestions.length) {
        var sug = document.createElement("div"); sug.className = "tc-sugs";
        suggestions.forEach(function(label) {
          var b = document.createElement("button"); b.type = "button"; b.className = "tc-sug";
          b.textContent = label; b.onclick = function() { userSay(label); }; sug.appendChild(b);
        });
        div.appendChild(sug);
      }
      histEl.appendChild(div); histEl.scrollTop = histEl.scrollHeight;
    }

    function addUserText(text) {
      var div = document.createElement("div"); div.className = "tc-msg user"; div.textContent = text;
      if (waSkin) { var tick = document.createElement("span"); tick.className = "tc-tick"; tick.textContent = "✓✓"; div.appendChild(tick); }
      histEl.appendChild(div); histEl.scrollTop = histEl.scrollHeight;
    }

    function addCatalog(vehicles) {
      var wrap = document.createElement("div"); wrap.className = "tc-cars";
      (vehicles||[]).forEach(function(v) {
        var card = document.createElement("div"); card.className = "tc-car";
        var label = v.year + " " + v.brand + " " + v.model;
        card.innerHTML = '<b>' + esc(label) + '</b><div class="m">' + esc(v.km||'') + (v.fuel ? ' · ' + esc(v.fuel) : '') +
          '</div><div class="p">R ' + Number(v.price||0).toLocaleString("en-ZA") +
          '</div><div class="tc-car-acts"><button type="button" class="tc-sec" data-a="finance">Finance</button>' +
          '<button type="button" class="tc-pri" data-a="test_drive">Test drive</button></div>';
        card.querySelectorAll("button").forEach(function(btn) {
          btn.onclick = function() {
            var a = btn.getAttribute("data-a");
            handleOut(bot.selectVehicleAction(label, a));
          };
        });
        wrap.appendChild(card);
      });
      histEl.appendChild(wrap); histEl.scrollTop = histEl.scrollHeight;
    }

    function addScheduler(scheduleType, days) {
      var box = document.createElement("div"); box.className = "tc-cal";
      box.innerHTML = '<div class="tc-cal-t">' + (scheduleType === "test_drive" ? "Pick a test drive" : "Pick a valuation slot") +
        '</div><div class="tc-grid" data-g="days"></div><div class="tc-grid" data-g="slots" style="display:none;margin-top:8px"></div>';
      var grid = box.querySelector('[data-g="days"]');
      var slots = box.querySelector('[data-g="slots"]');
      (days||[]).forEach(function(d) {
        var b = document.createElement("button"); b.type = "button"; b.textContent = d.label;
        b.onclick = function() {
          grid.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});
          b.classList.add("sel"); slots.style.display = "grid"; slots.innerHTML = "";
          bot.slotsFor(d.isSaturday).forEach(function(hr) {
            var s = document.createElement("button"); s.type = "button"; s.textContent = hr;
            s.onclick = function() {
              slots.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});
              s.classList.add("sel"); box.style.opacity = "0.75"; box.style.pointerEvents = "none";
              handleOut(bot.confirmSlot(scheduleType, d.label, hr));
            };
            slots.appendChild(s);
          });
        };
        grid.appendChild(b);
      });
      histEl.appendChild(box); histEl.scrollTop = histEl.scrollHeight;
    }

    function handleOut(out) {
      (out.replies||[]).forEach(function(r) {
        if (r.type === "text") addBotText(r.text, r.suggestions);
        if (r.type === "catalog") addCatalog(r.vehicles);
        if (r.type === "schedule") addScheduler(r.scheduleType, r.days);
      });
      persistLead(false);
      if ((out.handoffReady || (bot.getSession() && bot.getSession().qualified)) && !handoffPrompted) {
        handoffPrompted = true; waBar.classList.add("show");
        addBotText("Perfect — you're **qualified**. Tap **Open WhatsApp** and the yard gets your full ticket instantly.", ["Continue on WhatsApp"]);
      } else if (bot.getSession() && bot.getSession().qualified) { waBar.classList.add("show"); }
    }

    function userSay(text) {
      if (destroyed || !text || !String(text).trim()) return;
      var t = String(text).trim();
      if (t.toLowerCase() === "continue on whatsapp" || t.toLowerCase() === "open handoff") {
        persistLead(true);
        window.open(bot.whatsappHandoffUrl(), "_blank", "noopener");
        return;
      }
      addUserText(t);
      setTyping(true);
      var delay = 420 + Math.min(400, t.length * 8);
      setTimeout(function() {
        if (destroyed) return;
        setTyping(false);
        handleOut(bot.process(t));
      }, delay);
    }

    function send() { userSay(input.value); input.value = ""; input.focus(); }
    container.querySelector("#tcSend").onclick = send;
    input.addEventListener("keydown", function(e) { if (e.key === "Enter") send(); });
    container.querySelector("#tcWaBtn").onclick = function() {
      persistLead(true);
      window.open(bot.whatsappHandoffUrl(), "_blank", "noopener");
    };
    var closeBtn = container.querySelector("#tcClose");
    if (closeBtn && options.onClose) closeBtn.onclick = options.onClose;

    // Start chat
    var intro = document.createElement("div"); intro.className = "tc-intro";
    intro.innerHTML = '<div class="pill">' + (waSkin ? "Chat with the team" : "Live showroom assistant") + '</div>';
    histEl.appendChild(intro);
    var greet;
    if (waSkin) {
      greet = (CFG.greetingHuman && String(CFG.greetingHuman).trim()) ||
        "Howzit! You've reached **" + (CFG.dealerName||"the yard") + "**. What are you looking for today?";
    } else {
      greet = CFG.greeting ||
        "Hi — I'm **" + (CFG.assistantName||"your assistant") + "** at **" + (CFG.dealerName||"the showroom") +
        "**. Stock, test drives, trade-ins, hours — what do you need?";
    }
    var sugs = CFG.suggestions || ["Browse stock", "Trade-in valuation", "Showroom hours", "Finance help"];
    setTimeout(function() { addBotText(greet, sugs); }, 180);

    return { bot: bot, focus: function() { input.focus(); }, destroy: function() { destroyed = true; container.innerHTML = ""; } };
  }

  root.TruChatUI = { mount: mount, LS_KEY: DEFAULT_LS_KEY, detectVehicleFromPage: detectVehicleFromPage };
})(typeof window !== "undefined" ? window : globalThis);
</script>

    var mode = CFG.skin || "default";
    var fabIcon = resolveAsset(CFG.fabIconUrl || CFG.logoUrl || "");
    var logoResolved = resolveAsset(CFG.logoUrl || CFG.fabIconUrl || "");
    var cfgUi = Object.assign({}, CFG, { logoUrl: logoResolved, fabIconUrl: fabIcon });

    injectSharedCss();

    var WA_LABEL = "Chat with us on <strong>WhatsApp</strong>";
    var AI_LABEL = "Chat with <strong>" + (CFG.assistantName||"Ray") + "</strong> — stock, finance & trade-ins";

    if (mode === "both") {
      var norm = function(v,d){ v=(v==null?"":String(v)).trim(); if(!v) return d; return /^\d+$/.test(v)?v+"px":v; };
      var waSide = CFG.waSide === "right" ? "right" : "left";
      var aiSide = CFG.aiSide === "left" ? "left" : "right";
      createWidget(cfgUi, fabIcon, { side:waSide, bottom:norm(CFG.waBottom,"150px"), skin:"whatsapp", label:WA_LABEL, ariaLabel:"Chat with us on WhatsApp" });
      var ai = createWidget(cfgUi, fabIcon, { side:aiSide, bottom:norm(CFG.aiBottom,"24px"), skin:"default", label:AI_LABEL, ariaLabel:"Chat with " + (CFG.assistantName||"Ray") });
      window.TruChatWidget = ai;
    } else if (mode === "whatsapp") {
      window.TruChatWidget = createWidget(cfgUi, fabIcon, { side:"right", bottom:"24px", skin:"whatsapp", label:WA_LABEL });
    } else {
      window.TruChatWidget = createWidget(cfgUi, fabIcon, { side:"right", bottom:"24px", skin:"default", label:AI_LABEL });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

</body>
</html>
