services:
  - type: web
    name: flowprop
    runtime: node
    plan: starter
    rootDir: PropertyTrade
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/data
      # Shared secret for product-to-product calls (code verification from
      # PropLens + PropInspect). MUST equal FLOWPMS_SYNC_KEY on those services;
      # TRUFLOW_SYNC_KEY is the legacy alias the code also accepts.
      - key: FLOWPMS_SYNC_KEY
        sync: false
        value: ""
    disk:
      name: flowprop-data
      mountPath: /opt/render/project/data
      sizeGB: 5
