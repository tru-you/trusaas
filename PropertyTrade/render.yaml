services:
  - type: web
    name: flowprop
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/data
    disk:
      name: flowprop-data
      mountPath: /opt/render/project/data
      sizeGB: 5
