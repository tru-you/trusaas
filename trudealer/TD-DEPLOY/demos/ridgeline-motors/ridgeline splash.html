<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ridgeway Motors — 3D Splash Experience</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>

<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- GSAP for Smooth UI Animations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root {
  --bg: #030508;
  --orange: #FF6D00;
  --orange-soft: #FF9E80;
  --orange-glow: rgba(255, 109, 0, 0.4);
  --border: rgba(255, 255, 255, 0.1);
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: #f1f5f9;
  font-family: var(--sans);
  min-height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ─── WEBGL 3D CANVAS ────────────────────────────── */
#webgl-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
}

/* ─── OVERLAYS ───────────────────────────────────── */
.ambient-vignette {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: 
    radial-gradient(circle at 50% 50%, transparent 20%, rgba(3, 5, 8, 0.85) 80%),
    linear-gradient(to bottom, rgba(3, 5, 8, 0.4), transparent 30%, transparent 70%, var(--bg));
}

.grid-overlay {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 50px 50px;
  mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 80%);
}

/* ─── HUD UI FRAME ───────────────────────────────── */
.hud-frame {
  position: fixed;
  inset: 24px;
  z-index: 10;
  pointer-events: none;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--orange-soft);
  text-transform: uppercase;
}

.hud-tag {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(3, 5, 8, 0.7);
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
}

.hud-tl { top: 0; left: 0; }
.hud-tr { top: 0; right: 0; }
.hud-bl { bottom: 0; left: 0; }
.hud-br { bottom: 0; right: 0; }

.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--orange);
  box-shadow: 0 0 10px var(--orange);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}

/* ─── SPLASH HERO CONTENT ────────────────────────── */
.splash-viewport {
  position: relative;
  z-index: 5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 80px 24px 60px;
  text-align: center;
}

.brand-header {
  opacity: 0;
  transform: translateY(-20px);
}

.brand-title {
  font-size: clamp(48px, 10vw, 110px);
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 0.95;
  margin-bottom: 12px;
  user-select: none;
}

.brand-title .ridge {
  background: linear-gradient(180deg, #FFFFFF 0%, #E2E8F0 25%, #94A3B8 50%, #475569 80%, #1E293B 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
}

.brand-title .motors {
  background: linear-gradient(180deg, #FFE0B2 0%, #FF9800 25%, #FF6D00 55%, #E65100 85%, #BF360C 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 30px var(--orange-glow));
}

.brand-subtitle {
  font-family: var(--mono);
  font-size: clamp(12px, 2vw, 16px);
  letter-spacing: 0.3em;
  color: #94a3b8;
  text-transform: uppercase;
}

/* ─── CALL TO ACTION & RECORD BUTTONS ────────────── */
.cta-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  opacity: 0;
  transform: translateY(30px);
}

.enter-btn {
  background: linear-gradient(135deg, #FF6D00 0%, #DD2C00 100%);
  color: #FFFFFF;
  border: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 800;
  padding: 18px 48px;
  border-radius: 99px;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(255, 109, 0, 0.4);
  transition: transform 0.25s, box-shadow 0.25s;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.enter-btn:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 0 45px rgba(255, 109, 0, 0.7);
}

.record-btn {
  background: rgba(15, 23, 42, 0.75);
  color: #FF6D00;
  border: 1px solid rgba(255, 109, 0, 0.4);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  padding: 10px 20px;
  border-radius: 99px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.record-btn:hover {
  background: rgba(255, 109, 0, 0.15);
  border-color: #FF6D00;
  color: #FFF;
}

.record-btn.recording {
  background: #DD2C00;
  color: #FFF;
  border-color: #FF6D00;
  animation: pulse 1s infinite;
}

@media (max-width: 768px) {
  .hud-frame { display: none; }
}
</style>
</head>
<body>

<!-- WEBGL 3D CANVAS -->
<canvas id="webgl-canvas"></canvas>

<!-- OVERLAYS -->
<div class="ambient-vignette"></div>
<div class="grid-overlay"></div>

<!-- HUD FRAME -->
<div class="hud-frame">
  <div class="hud-tag hud-tl"><span class="pulse-dot"></span> RIDGEWAY MOTORS // 3D STAGE</div>
  <div class="hud-tag hud-tr">SYS // 60 FPS</div>
  <div class="hud-tag hud-bl">AUTOMOTIVE EXCELLENCE</div>
  <div class="hud-tag hud-br">DRAG TO ROTATE 3D CORE</div>
</div>

<!-- SPLASH VIEWPORT CONTENT -->
<main class="splash-viewport">

  <!-- TOP BRAND TITLE -->
  <header class="brand-header" id="brandHeader">
    <h1 class="brand-title">
      <span class="ridge">Ridgeway</span> <span class="motors">Motors</span>
    </h1>
    <div class="brand-subtitle">Automotive Excellence</div>
  </header>

  <!-- BOTTOM CTA & RECORD CONTROLS -->
  <div class="cta-panel" id="ctaPanel">
    <button class="enter-btn" onclick="alert('Welcome to Ridgeway Motors!')">
      Enter Showroom →
    </button>

    <!-- EXPORT VIDEO BUTTON -->
    <button class="record-btn" id="recordBtn">
      🎥 Record 3D Rotation Video (WebM)
    </button>
  </div>

</main>

<script>
/* ── THREE.JS 3D ROTATING ENGINE ─────────────────── */
const canvas = document.getElementById('webgl-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 13;

// Lighting Setup
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const orangeLight = new THREE.PointLight(0xff6d00, 3.5, 40);
orangeLight.position.set(5, 5, 5);
scene.add(orangeLight);

const chromeLight = new THREE.PointLight(0xffffff, 2.5, 40);
chromeLight.position.set(-5, -5, -2);
scene.add(chromeLight);

// 3D Emblem Container Group
const group = new THREE.Group();
scene.add(group);

// 1. Orbiting Orange Neon Torus Rings
const ringGeo1 = new THREE.TorusGeometry(3.2, 0.035, 16, 100);
const ringMat1 = new THREE.MeshStandardMaterial({
  color: 0xff6d00,
  emissive: 0xff3d00,
  emissiveIntensity: 0.8,
  roughness: 0.2
});
const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
ring1.rotation.x = Math.PI / 3;
group.add(ring1);

const ringGeo2 = new THREE.TorusGeometry(4.0, 0.02, 16, 100);
const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xff6d00, wireframe: true, transparent: true, opacity: 0.35 });
const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
ring2.rotation.y = Math.PI / 4;
group.add(ring2);

// 2. Center 3D Dual-Material Shield Core (Black Chrome + Lava Orange Glass)
const shape = new THREE.Shape();
shape.moveTo(0, 2);
shape.lineTo(-1.8, 0.5);
shape.lineTo(-1.2, -1.8);
shape.lineTo(0, -2.5);
shape.lineTo(1.2, -1.8);
shape.lineTo(1.8, 0.5);
shape.closePath();

const extrudeSettings = { depth: 0.4, bevelEnabled: true, bevelSegments: 5, steps: 2, bevelSize: 0.1, bevelThickness: 0.1 };
const coreGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
coreGeo.center();

// Black Chrome Material (Left Face Accent)
const chromeMat = new THREE.MeshStandardMaterial({
  color: 0x1e293b,
  roughness: 0.1,
  metalness: 0.95,
});

// Lava Orange Glass Material (Right Face Accent)
const orangeMat = new THREE.MeshStandardMaterial({
  color: 0xff6d00,
  emissive: 0xff3d00,
  emissiveIntensity: 0.4,
  roughness: 0.15,
  metalness: 0.5,
});

const coreMesh = new THREE.Mesh(coreGeo, [chromeMat, orangeMat]);
group.add(coreMesh);

// Outer Wireframe Overlay
const wireMat = new THREE.MeshBasicMaterial({ color: 0xff6d00, wireframe: true, transparent: true, opacity: 0.35 });
const wireMesh = new THREE.Mesh(coreGeo, wireMat);
group.add(wireMesh);

// 3. Floating Micro Particle Stars
const particleCount = 200;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount * 3; i += 3) {
  positions[i] = (Math.random() - 0.5) * 30;
  positions[i + 1] = (Math.random() - 0.5) * 30;
  positions[i + 2] = (Math.random() - 0.5) * 30;
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({ size: 0.045, color: 0xff6d00, transparent: true, opacity: 0.5 });
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Interactive Mouse Physics & Pointer Drag
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let dragVelocity = { x: 0, y: 0 };

window.addEventListener('pointerdown', (e) => {
  isDragging = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
  dragVelocity.x = deltaMove.x * 0.005;
  dragVelocity.y = deltaMove.y * 0.005;
  group.rotation.y += dragVelocity.x;
  group.rotation.x += dragVelocity.y;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('pointerup', () => isDragging = false);

// 3D Render & Continuous Rotation Animation Loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  if (!isDragging) {
    dragVelocity.x *= 0.95;
    dragVelocity.y *= 0.95;
    group.rotation.y += dragVelocity.x + 0.012; // Continuous 3D rotation
    group.rotation.x += dragVelocity.y;
  }

  ring1.rotation.z = elapsedTime * 0.2;
  ring2.rotation.z = -elapsedTime * 0.15;

  group.position.y = Math.sin(elapsedTime * 0.8) * 0.25; // Floating animation
  particles.rotation.y = elapsedTime * 0.015;

  renderer.render(scene, camera);
}

animate();

// Resize Handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ── GSAP ENTRANCE ANIMATIONS ────────────────────── */
gsap.timeline({ defaults: { ease: 'power3.out' } })
  .to('#brandHeader', { opacity: 1, y: 0, duration: 1, delay: 0.3 })
  .to('#ctaPanel', { opacity: 1, y: 0, duration: 0.8 }, '-=0.5');

/* ── CANVAS WEBM VIDEO RECORDING ENGINE ──────────── */
const recordBtn = document.getElementById('recordBtn');
let mediaRecorder;
let recordedChunks = [];

recordBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') return;

  recordedChunks = [];
  const stream = canvas.captureStream(60); // Record 60 FPS
  
  try {
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
  } catch (e) {
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  }

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Ridgeway-Motors-3D-Rotation-Loop.webm';
    a.click();

    recordBtn.classList.remove('recording');
    recordBtn.innerText = '🎥 Record 3D Rotation Video (WebM)';
  };

  mediaRecorder.start();
  recordBtn.classList.add('recording');
  recordBtn.innerText = '🔴 Recording 3D Rotation (6s)...';

  // Record a perfect 6-second rotation loop
  setTimeout(() => {
    mediaRecorder.stop();
  }, 6000);
});
</script>
</body>
</html>
