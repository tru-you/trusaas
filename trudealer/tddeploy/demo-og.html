<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;
    background:
      radial-gradient(70% 48% at 22% 18%,#132132 0%,transparent 62%),
      radial-gradient(58% 44% at 86% 86%,rgba(7,136,155,.22) 0%,transparent 62%),

    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(72% 55% at 30% 30%,#000,transparent 78%);
    mask-image:radial-gradient(72% 55% at 30% 30%,#000,transparent 78%)}
  .inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:56px 64px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:#E5A93E;margin-bottom:30px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:420;font-size:76px;line-height:1.03;letter-spacing:-.03em;color:#F5F1E8;max-width:900px}
  h1 em{font-style:italic;color:#00E0F5;font-variation-settings:"SOFT" 100,"WONK" 1}
  .sub{margin-top:24px;font-size:24px;line-height:1.45;color:rgba(245,241,232,.7);max-width:760px}
  .sub b{color:rgba(245,241,232,.94)}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(245,241,232,.18);padding-top:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .glyph{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#22B8CC,#065F73);display:grid;place-items:center;box-shadow:0 0 26px rgba(0,224,245,.4)}
  .word{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .word b{color:#00E0F5}

<div class="card">
  <div class="grid"></div>
  <div class="inner">
    <div class="eyebrow">Free demo &middot; 24 hours &middot; no card</div>

    <p class="sub">Shoot a car on your phone, export, and it publishes to a real showroom — <b>orbit, inspection report and all.</b></p>
    <div class="foot">
      <div class="brand">
        <span class="glyph"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></span>
        <span class="word">Tru<b>Dealer</b></span>
      </div>
      <div class="urls">trudealer.tru-saas.com/demo</div>
    </div>
  </div>
</div>
