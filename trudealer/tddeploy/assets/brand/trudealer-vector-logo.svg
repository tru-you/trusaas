<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%" aria-label="TruDealer Logo">
  <defs>
    <!-- Background glow -->
    <radialGradient id="cyanAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0B7C72" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B7C72" stop-opacity="0"/>
    </radialGradient>

    <!-- Chrome Face Gradient -->
    <linearGradient id="chromeFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDE4EC"/>
      <stop offset="18%" stop-color="#B8C5D3"/>
      <stop offset="50%" stop-color="#4B5868"/>
      <stop offset="52%" stop-color="#2D3748"/>
      <stop offset="85%" stop-color="#5A687A"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>

    <!-- Cyan Extrusion Bevel Gradient -->
    <linearGradient id="cyanBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#00C4D6"/>
      <stop offset="100%" stop-color="#0B7C72"/>
    </linearGradient>

    <!-- Specular Bevel Line -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7EE7F2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.45"/>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .brand-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 800;
      font-size: 132px;
      letter-spacing: -0.02em;
    }
    .reg-mark {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 38px;
    }
  </style>

  <!-- Ambient Underglow -->
  <ellipse cx="450" cy="160" rx="380" ry="90" fill="url(#cyanAmbient)"/>

  <!-- 3D Extrusion Shadow Layer 4 (Bottom-most) -->
  <text x="75" y="194" class="brand-text" fill="#021B1D" opacity="0.9" filter="url(#badgeShadow)">TruDealer</text>
  <text x="735" y="104" class="reg-mark" fill="#021B1D" opacity="0.9">®</text>

  <!-- 3D Extrusion Layer 3 (Deep Cyan Base) -->
  <text x="75" y="190" class="brand-text" fill="#064E48" stroke="#00F2FE" stroke-width="6" stroke-linejoin="round">TruDealer</text>
  <text x="735" y="100" class="reg-mark" fill="#064E48" stroke="#00F2FE" stroke-width="2">®</text>

  <!-- 3D Extrusion Layer 2 (Illuminated Cyan Mid-Extrusion) -->
  <text x="75" y="184" class="brand-text" fill="url(#cyanBevel)" stroke="#00F2FE" stroke-width="4" stroke-linejoin="round" filter="url(#cyanGlow)">TruDealer</text>
  <text x="735" y="96" class="reg-mark" fill="url(#cyanBevel)" stroke="#00F2FE" stroke-width="2">®</text>

  <!-- 3D Extrusion Layer 1 (Upper Bevel Wall) -->
  <text x="75" y="178" class="brand-text" fill="#1C2733" stroke="#253545" stroke-width="3">TruDealer</text>
  <text x="735" y="92" class="reg-mark" fill="#1C2733" stroke="#253545" stroke-width="1.5">®</text>

  <!-- Front Face: Brushed Chrome Plate -->
  <text x="75" y="175" class="brand-text" fill="url(#chromeFace)" stroke="url(#specularRim)" stroke-width="2.5" stroke-linejoin="round">TruDealer</text>
  <text x="735" y="90" class="reg-mark" fill="url(#chromeFace)" stroke="url(#specularRim)" stroke-width="1.2">®</text>

  <!-- Specular Top Highlights (Glint) -->
  <text x="75" y="175" class="brand-text" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="12 40 8 30" opacity="0.75">TruDealer</text>
</svg>
