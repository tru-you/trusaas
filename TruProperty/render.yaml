services:
  - type: web
    name: truproperty
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/data
      - key: TRUPROPERTY_ACCESS_CODE
        sync: false
        value: ""
      - key: TRUFLOW_SYNC_KEY
        sync: false
        value: ""
      - key: GEMINI_API_KEY
        sync: false
        value: ""
    disk:
      name: truproperty-data
      mountPath: /opt/render/project/data
      sizeGB: 5
