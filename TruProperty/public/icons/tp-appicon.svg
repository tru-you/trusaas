<svg id="icon-tp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200">
  <defs>
    <linearGradient id="metalTop1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="30%" stop-color="#64748B"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cyanTop1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FE3DC"/>
      <stop offset="35%" stop-color="#14B8A6"/>
      <stop offset="75%" stop-color="#0E9D98"/>
      <stop offset="100%" stop-color="#0A7570"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A1420"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0E9D98" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="dropShadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0A1420" flood-opacity="0.4"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="3"/>
  <!-- Subtle teal glow behind letters -->
  <ellipse cx="105" cy="105" rx="50" ry="40" fill="#0E9D98" opacity="0.06" filter="url(#glowFilter)"/>
  <!-- 3D text stack: shadow layers then gradient top -->
  <g filter="url(#dropShadow1)" transform="translate(18, 125)">
    <text x="3" y="3" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="95"><tspan fill="#0F172A">T</tspan><tspan fill="#042F2E">P</tspan></text>
    <text x="2" y="2" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="95"><tspan fill="#334155">T</tspan><tspan fill="#0E7490">P</tspan></text>
    <text x="1" y="1" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="95"><tspan fill="#64748B">T</tspan><tspan fill="#22D3EE">P</tspan></text>
    <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="95"><tspan fill="url(#metalTop1)">T</tspan><tspan fill="url(#cyanTop1)">P</tspan></text>
  </g>
</svg>
