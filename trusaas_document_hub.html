<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruSaaS — Document Hub + Mini CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --void:#0a0b10;--dark:#12141c;--panel:#161822;--ink:#f4f5f7;--muted:#8b93a7;
  --pink:#e11d8c;--purple:#8b5cf6;--blue:#0ea5e9;--green:#10b981;--orange:#f59e0b;--red:#ef4444;
  --border:#2a2e3a;--radius:12px;
  --font-d:'Space Grotesk',sans-serif;--font-b:'DM Sans',sans-serif;--font-m:'JetBrains Mono',monospace;
  /* Light document paper */
  --paper:#ffffff;--paper-ink:#0f172a;--paper-muted:#64748b;--paper-line:#e2e8f0;--paper-soft:#f8fafc;--paper-accent:#db2777;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.5}
.nav{background:rgba(10,11,16,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;padding:12px 20px}
.nav-inner{max-width:1480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--dark);border:1px solid var(--border);display:grid;place-items:center}
.brand h1{font-family:var(--font-d);font-size:15px;letter-spacing:2px;text-transform:uppercase}
.brand span{display:block;font-family:var(--font-m);font-size:9px;letter-spacing:2px;color:var(--pink);margin-top:2px}
.nav-actions{display:flex;gap:8px;flex-wrap:wrap}
.wrap{max-width:1480px;margin:0 auto;padding:20px 16px 48px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 18px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:var(--font-m);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-color:transparent}
.tab.on.q{background:linear-gradient(135deg,var(--blue),var(--purple))}
.tab.on.s{background:linear-gradient(135deg,var(--purple),var(--pink))}
.tab.on.c{background:linear-gradient(135deg,var(--green),var(--blue))}
.bar{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .lbl{font-family:var(--font-m);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.chip{padding:5px 11px;background:var(--dark);border:1px solid var(--border);border-radius:8px;font-family:var(--font-m);font-size:10px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip .x:hover{color:var(--red)}
.workspace{display:grid;grid-template-columns:400px 1fr;gap:20px}
@media(max-width:1100px){.workspace{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.form-panel{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto;align-self:start}
.form-panel h2{font-family:var(--font-d);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.form-panel .sub{font-family:var(--font-m);font-size:10px;color:var(--muted);margin-bottom:16px}
.fg{margin-bottom:12px}
.fg label{display:block;font-family:var(--font-m);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--pink);margin-bottom:5px;font-weight:600}
.fg input,.fg textarea,.fg select{width:100%;background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--ink);font-family:var(--font-b);font-size:13px;outline:none}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(225,29,140,.12)}
.fg textarea{min-height:64px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.li{background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.li .fr{grid-template-columns:2fr 1fr 1fr}
.li input{padding:7px 9px;font-size:12px;background:var(--void,#08090e);border:1px solid var(--border);border-radius:8px;color:var(--ink);width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border:none;border-radius:10px;font-family:var(--font-m);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.4px}
.btn-p{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}
.btn-p.blue{background:linear-gradient(135deg,var(--blue),var(--purple))}
.btn-p.green{background:linear-gradient(135deg,var(--green),var(--blue))}
.btn-p.purple{background:linear-gradient(135deg,var(--purple),var(--pink))}
.btn-s{background:var(--dark);color:var(--ink);border:1px solid var(--border);margin-top:8px}
.btn-s:hover{border-color:var(--pink);color:var(--pink)}
.btn-rm{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:10px;padding:5px 10px;border-radius:6px;cursor:pointer;margin-top:6px;font-family:var(--font-m)}
.btn-rm:hover{color:var(--red);border-color:var(--red)}
.btn-sm{width:auto;padding:7px 12px;font-size:11px}
.div{height:1px;background:var(--border);margin:16px 0}
.toggle{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.toggle input{width:16px;height:16px;accent-color:var(--pink)}
.toggle label{font-family:var(--font-m);font-size:11px;color:var(--muted);cursor:pointer}
.qf-label{font-family:var(--font-m);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
.qf-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qf{padding:6px 12px;background:var(--dark);border:1px solid var(--border);border-radius:8px;font-family:var(--font-m);font-size:10px;color:var(--muted);cursor:pointer}
.qf:hover{color:var(--pink);border-color:var(--pink)}
.icon-btn{background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--muted);cursor:pointer;font-family:var(--font-m);font-size:11px}
.icon-btn:hover{color:var(--pink);border-color:var(--pink)}
.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.preview-head h2{font-family:var(--font-m);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.preview-actions{display:flex;gap:8px;flex-wrap:wrap}
.print-btn{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;border-radius:10px;padding:9px 16px;font-family:var(--font-m);font-size:11px;font-weight:600;cursor:pointer}
.print-btn.ghost{background:var(--dark);color:var(--muted);border:1px solid var(--border)}
.print-btn.blue{background:linear-gradient(135deg,var(--blue),var(--purple))}
.print-btn.purple{background:linear-gradient(135deg,var(--purple),var(--pink))}
.print-btn.green{background:linear-gradient(135deg,var(--green),var(--blue))}

/* LIGHT document paper (invoices & all docs) */
.doc-page{
  background:var(--paper)!important;color:var(--paper-ink)!important;
  border:1px solid #dbe3ee;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;padding:36px 40px;background:var(--paper-soft)!important;border-bottom:1px solid var(--paper-line)!important}
.logo-mark{width:48px;height:48px;background:#fff;border-radius:12px;display:grid;place-items:center;border:1px solid var(--paper-line)}
.logo-mark svg{width:30px;height:30px}
.brand-text h1{font-family:var(--font-d);font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--paper-ink)!important}
.brand-text span{display:block;font-family:var(--font-m);font-size:10px;letter-spacing:2px;color:var(--paper-accent)!important;margin-top:3px}
.doc-meta{text-align:right}
.doc-meta .label{font-family:var(--font-m);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--paper-muted)!important;margin-bottom:4px}
.doc-meta .value{font-family:var(--font-m);font-size:20px;font-weight:600;color:var(--paper-ink)!important}
.doc-meta .badge{display:inline-block;margin-top:8px;padding:4px 12px;font-family:var(--font-m);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border-radius:6px}
.badge.invoice{background:#fce7f3;color:#be185d;border:1px solid #f9a8d4}
.badge.invoice.paid{background:#d1fae5;color:#047857;border-color:#6ee7b7}
.badge.quote{background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc}
.badge.quote.approved{background:#d1fae5;color:#047857;border-color:#6ee7b7}
.badge.sla{background:#ede9fe;color:#6d28d9;border:1px solid #c4b5fd}
.badge.sla.signed{background:#d1fae5;color:#047857;border-color:#6ee7b7}
.doc-body{padding:36px 40px;background:var(--paper)!important;color:var(--paper-ink)!important}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-bottom:28px}
.column h3{font-family:var(--font-m);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--paper-accent)!important;margin-bottom:10px}
.column h3.quote{color:#0284c7!important}.column h3.sla{color:#7c3aed!important}
.column p{color:var(--paper-muted)!important;font-size:13px;line-height:1.6}
.column p strong{color:var(--paper-ink)!important}
.right-col{text-align:right}
table{width:100%;border-collapse:collapse;margin-bottom:24px}
thead th{text-align:left;font-family:var(--font-m);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--paper-muted)!important;padding:10px 12px;border-bottom:2px solid var(--paper-line)!important;background:var(--paper-soft)!important}
thead th:last-child,tbody td:last-child{text-align:right}
tbody td{padding:12px;border-bottom:1px solid var(--paper-line)!important;font-size:13px;color:var(--paper-muted)!important}
tbody td:first-child{color:var(--paper-ink)!important;font-weight:500}
tbody td:last-child{font-family:var(--font-m);color:var(--paper-ink)!important}
.totals{display:flex;justify-content:flex-end;margin-bottom:28px}
.totals-box{width:280px}
.totals-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;color:var(--paper-muted)!important}
.totals-row span:last-child{font-family:var(--font-m)}
.totals-row.total{border-top:2px solid var(--paper-accent);margin-top:6px;padding-top:10px;font-size:17px;font-weight:700;color:var(--paper-ink)!important}
.totals-row.total.quote{border-top-color:#0284c7}
.totals-row.total.sla{border-top-color:#7c3aed}
.section{border-top:1px solid var(--paper-line)!important;padding-top:20px;margin-bottom:24px}
.section h3{font-family:var(--font-m);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--paper-accent)!important;margin-bottom:10px}
.section h3.quote{color:#0284c7!important}.section h3.sla{color:#7c3aed!important}
.section p,.section li{color:var(--paper-muted)!important;font-size:13px;line-height:1.7}
.section strong{color:var(--paper-ink)!important}
.wise-box,.validity-box{background:var(--paper-soft)!important;border:1px solid var(--paper-line)!important;border-radius:10px;padding:16px 18px;margin-top:12px}
.wise-info p{margin:0;color:var(--paper-muted)!important;font-size:13px}
.ref-note{color:var(--paper-muted)!important;font-family:var(--font-m);font-size:11px;margin-top:10px}
.ref-note strong{color:var(--paper-ink)!important}
.doc-footer{padding:22px 40px;background:var(--paper-soft)!important;border-top:1px solid var(--paper-line)!important;display:flex;justify-content:space-between;align-items:center;gap:12px}
.footer-left{font-size:12px;color:var(--paper-muted)!important}
.footer-left strong{color:var(--paper-ink)!important}
.footer-right{font-family:var(--font-m);font-size:10px;color:var(--paper-muted)!important}
.sign-block{margin-top:24px;padding-top:18px;border-top:1px solid var(--paper-line)!important}
.sign-row{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:16px}
.sign-field{border-bottom:1px solid var(--paper-line)!important;min-height:40px;margin-bottom:4px}
.sign-label{font-family:var(--font-m);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--paper-muted)!important}

/* CRM */
.crm-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media(max-width:900px){.crm-grid{grid-template-columns:1fr}}
.crm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:700px){.crm-stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat .n{font-family:var(--font-d);font-size:22px;font-weight:700}
.stat .l{font-family:var(--font-m);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.crm-card{background:var(--dark);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.crm-card h4{font-size:14px;margin-bottom:4px}
.crm-card .meta{font-family:var(--font-m);font-size:10px;color:var(--muted)}
.crm-card .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-family:var(--font-m);font-size:9px;letter-spacing:.5px;text-transform:uppercase}
.pill.lead{background:rgba(14,165,233,.15);color:#38bdf8}
.pill.client{background:rgba(16,185,129,.15);color:#34d399}
.pill.hot{background:rgba(245,158,11,.15);color:#fbbf24}
.pill.won{background:rgba(16,185,129,.2);color:#6ee7b7}
.pill.lost{background:rgba(239,68,68,.15);color:#f87171}
.act{font-size:12px;color:var(--muted);border-left:2px solid var(--border);padding:6px 0 6px 10px;margin:6px 0}
.search{width:100%;margin-bottom:12px;background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--ink)}

.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-family:var(--font-m);font-size:12px;z-index:99;transform:translateY(80px);opacity:0;transition:.25s;display:flex;gap:8px;align-items:center}
.toast.show{transform:none;opacity:1}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--pink)}
.toast-dot.g{background:var(--green)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:90;opacity:0;pointer-events:none;transition:.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:480px;width:92%;max-height:90vh;overflow:auto}
.modal h3{font-family:var(--font-d);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;padding:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .nav,.tabs,.bar,.form-panel,.preview-head,.toast,.modal-overlay,.crm-only{display:none!important}
  .wrap{padding:0!important;max-width:100%!important}
  .workspace{display:block!important}
  .panel{border:none!important;padding:0!important;background:transparent!important;box-shadow:none!important}
  .doc-page{box-shadow:none!important;border:none!important;border-radius:0!important}
}

/* PDF capture mode — full A4 white page */
.pdf-export{
  position:fixed!important;left:-10000px!important;top:0!important;width:210mm!important;
  background:#fff!important;color:#0f172a!important;z-index:1;padding:0!important;
  box-shadow:none!important;border:none!important;border-radius:0!important;
}
.pdf-export .doc-page{width:210mm!important;max-width:210mm!important;margin:0!important;border:none!important;box-shadow:none!important;border-radius:0!important}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#0a0b10"/><path d="M8 20l4-8 4 5 4-9 4 12" stroke="#e11d8c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div><h1>TruSaaS</h1><span>Docs · Mini CRM · Quotes</span></div>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" onclick="openSaveDraft()">Save draft</button>
      <button class="icon-btn" onclick="switchView('crm')">CRM</button>
      <button class="icon-btn" onclick="exportAllJSON()">Export data</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-type="invoice" onclick="switchView('invoice')">Invoice</button>
    <button class="tab q" data-type="quote" onclick="switchView('quote')">Quote</button>
    <button class="tab s" data-type="sla" onclick="switchView('sla')">SLA</button>
    <button class="tab c" data-type="crm" onclick="switchView('crm')">Mini CRM</button>
  </div>

  <div class="bar" id="drafts-bar">
    <span class="lbl">Drafts</span>
    <div id="drafts-list" style="display:flex;gap:6px;flex-wrap:wrap;flex:1"></div>
  </div>

  <div id="docs-workspace" class="workspace">
    <div class="panel form-panel" id="form-panel"></div>
    <div class="panel">
      <div class="preview-head">
        <h2>Live preview · light paper</h2>
        <div class="preview-actions">
          <button class="print-btn ghost" id="btn-html" onclick="saveAsHTML()">HTML</button>
          <button class="print-btn ghost" id="btn-pdf" onclick="saveAsPDF()">PDF full page</button>
          <button class="print-btn ghost" id="btn-convert" onclick="convertQuoteToInvoice()" style="display:none">→ Invoice</button>
          <button class="print-btn" id="btn-print" onclick="window.print()">Print</button>
        </div>
      </div>
      <div class="doc-page" id="doc-output"></div>
    </div>
  </div>

  <div id="crm-workspace" class="crm-only" style="display:none">
    <div class="crm-stats" id="crm-stats"></div>
    <div class="crm-grid">
      <div class="panel">
        <h2 style="font-family:var(--font-d);font-size:14px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Clients &amp; leads</h2>
        <input class="search" id="crm-search" placeholder="Search name, email, phone, company…" oninput="renderCRM()">
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
          <button class="icon-btn" onclick="openClientModal()">+ Client</button>
          <button class="icon-btn" onclick="openLeadModal()">+ Lead</button>
        </div>
        <div id="crm-list"></div>
      </div>
      <div class="panel">
        <h2 style="font-family:var(--font-d);font-size:14px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Activity</h2>
        <div id="crm-activity"></div>
        <div class="div"></div>
        <h2 style="font-family:var(--font-d);font-size:14px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Quick note</h2>
        <div class="fg"><label>Linked record</label>
          <select id="note-link"></select>
        </div>
        <div class="fg"><label>Note</label><textarea id="note-text" placeholder="Called DP — interested in TruFlow + TruLens…"></textarea></div>
        <button class="btn btn-p green" onclick="addNote()">Log note</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="toast-dot" id="toast-dot"></span><span id="toast-msg"></span></div>

<div class="modal-overlay" id="draft-modal">
  <div class="modal">
    <h3>Save draft</h3>
    <div class="fg"><label>Name</label><input id="draft-name" placeholder="e.g. MKR — Full Stack quote"></div>
    <div class="modal-actions">
      <button class="btn btn-p" onclick="saveDraft()">Save</button>
      <button class="btn btn-s" onclick="closeModal('draft-modal')">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="client-modal">
  <div class="modal">
    <h3>Add / edit client</h3>
    <input type="hidden" id="c-id">
    <div class="fg"><label>Company / name</label><input id="c-name" placeholder="MKR Auto Sales"></div>
    <div class="fr">
      <div class="fg"><label>Email</label><input id="c-email" placeholder="sales@mkrautosales.co.za"></div>
      <div class="fg"><label>Phone</label><input id="c-phone" placeholder="27…"></div>
    </div>

<script>
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const $ = id => document.getElementById(id);
const currencySymbols={ZAR:'R',GBP:'£',USD:'$',EUR:'€'};
let currentDocType='invoice';
let currentView='invoice';

function toast(msg,ok){
  const el=$('toast');$('toast-msg').textContent=msg;$('toast-dot').className='toast-dot'+(ok?' g':'');
  el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400);
}
function closeModal(id){$(id).classList.remove('open')}
function openModal(id){$(id).classList.add('open')}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));

function todayVal(){return new Date().toISOString().slice(0,10)}
function futureVal(d){const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
function fmtDate(d){if(!d)return'';return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
function fmtMoney(n,s){return (s||'R')+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function peekNum(type){
  const c=LS.get('ts_counters',{});const y=new Date().getFullYear();const k=type+'_'+y;
  const n=(c[k]||0)+1;const p=type==='invoice'?'TS-INV':type==='quote'?'TS-QTE':'TS-SLA';
  return p+'-'+y+'-'+String(n).padStart(3,'0');
}
function consumeNum(type){
  const c=LS.get('ts_counters',{});const y=new Date().getFullYear();const k=type+'_'+y;
  c[k]=(c[k]||0)+1;LS.set('ts_counters',c);
  const p=type==='invoice'?'TS-INV':type==='quote'?'TS-QTE':'TS-SLA';
  return p+'-'+y+'-'+String(c[k]).padStart(3,'0');
}

/* ── CRM ── */
function getClients(){return LS.get('ts_clients',[])}
function setClients(a){LS.set('ts_clients',a)}
function getLeads(){return LS.get('ts_leads',[])}
function setLeads(a){LS.set('ts_leads',a)}
function getActivity(){return LS.get('ts_activity',[])}
function pushActivity(text,link){
  const a=getActivity();a.unshift({id:Date.now(),text,link:link||'',at:new Date().toISOString()});
  LS.set('ts_activity',a.slice(0,80));
}

function openClientModal(id){
  const c=id?getClients().find(x=>x.id===id):null;
  $('c-id').value=c?c.id:'';
  $('c-name').value=c?c.name:'';$('c-email').value=c?c.email||'':'';
  $('c-phone').value=c?c.phone||'':'';$('c-addr').value=c?c.addr||'':'';
  $('c-status').value=c?c.status||'Active':'Active';$('c-notes').value=c?c.notes||'':'';
  openModal('client-modal');
}
function openLeadModal(){openModal('lead-modal')}
function saveClientRecord(){
  const name=$('c-name').value.trim();if(!name){toast('Name required');return}
  const id=Number($('c-id').value)||Date.now();
  let list=getClients();
  const rec={id,name,email:$('c-email').value.trim(),phone:$('c-phone').value.trim(),addr:$('c-addr').value.trim(),status:$('c-status').value,notes:$('c-notes').value.trim(),updated:new Date().toISOString()};
  const i=list.findIndex(x=>x.id===id);
  if(i>=0)list[i]=rec;else list.push(rec);
  setClients(list);pushActivity('Client saved: '+name,name);
  closeModal('client-modal');renderCRM();renderClientSelect();toast('Client saved',true);
}
function saveLeadRecord(){
  const name=$('l-name').value.trim();if(!name){toast('Lead name required');return}
  const list=getLeads();
  const rec={id:Date.now(),name,company:$('l-company').value.trim(),phone:$('l-phone').value.trim(),email:$('l-email').value.trim(),interest:$('l-interest').value,stage:$('l-stage').value,value:Number($('l-value').value)||0,notes:$('l-notes').value.trim(),created:new Date().toISOString()};
  list.unshift(rec);setLeads(list);pushActivity('Lead: '+name+' · '+rec.stage+' · '+rec.interest,name);
  $('l-name').value='';$('l-company').value='';$('l-phone').value='';$('l-email').value='';$('l-notes').value='';
  closeModal('lead-modal');renderCRM();toast('Lead saved',true);
}
function deleteClient(id){setClients(getClients().filter(c=>c.id!==id));renderCRM();renderClientSelect();toast('Client removed')}
function deleteLead(id){setLeads(getLeads().filter(l=>l.id!==id));renderCRM();toast('Lead removed')}
function loadClientToForm(id){
  const c=getClients().find(x=>x.id===id);if(!c)return;
  switchView('invoice');
  setTimeout(()=>{
    if($('f-client-name'))$('f-client-name').value=c.name;
    if($('f-client-addr'))$('f-client-addr').value=c.addr||'';
    if($('f-client-email'))$('f-client-email').value=c.email||'';
    if($('f-client-phone'))$('f-client-phone').value=c.phone||'';
    render();toast('Loaded '+c.name,true);
  },50);
}
function addNote(){
  const link=$('note-link').value;const t=$('note-text').value.trim();
  if(!t){toast('Write a note');return}
  pushActivity(t,link);$('note-text').value='';renderCRM();toast('Note logged',true);
}
function renderCRM(){
  const q=($('crm-search')?.value||'').toLowerCase();
  const clients=getClients().filter(c=>!q||JSON.stringify(c).toLowerCase().includes(q));
  const leads=getLeads().filter(l=>!q||JSON.stringify(l).toLowerCase().includes(q));
  const pipe=getLeads().filter(l=>!['Won','Lost'].includes(l.stage)).reduce((s,l)=>s+(l.value||0),0);
  const won=getLeads().filter(l=>l.stage==='Won').length;
  $('crm-stats').innerHTML=`
    <div class="stat"><div class="n">${clients.length}</div><div class="l">Clients</div></div>
    <div class="stat"><div class="n">${leads.length}</div><div class="l">Leads</div></div>
    <div class="stat"><div class="n">R${(pipe/1000).toFixed(0)}k</div><div class="l">Open pipeline</div></div>
    <div class="stat"><div class="n">${won}</div><div class="l">Won</div></div>`;
  let html='';
  leads.forEach(l=>{
    const pill=l.stage==='Hot'?'hot':l.stage==='Won'?'won':l.stage==='Lost'?'lost':'lead';
    html+=`<div class="crm-card"><div class="row"><div>
      <span class="pill ${pill}">${esc(l.stage)}</span>
      <h4 style="margin-top:6px">${esc(l.name)}${l.company?' · '+esc(l.company):''}</h4>
      <div class="meta">${esc(l.interest)} · R${Number(l.value||0).toLocaleString('en-ZA')}</div>
      <div class="meta">${esc(l.phone||'')} ${esc(l.email||'')}</div>
      ${l.notes?`<div class="act">${esc(l.notes)}</div>`:''}
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <button class="icon-btn" onclick="promoteLead(${l.id})">→ Client</button>
      <button class="icon-btn" onclick="deleteLead(${l.id})">Delete</button>
    </div></div></div>`;
  });
  clients.forEach(c=>{
    html+=`<div class="crm-card"><div class="row"><div>
      <span class="pill client">${esc(c.status||'Active')}</span>
      <h4 style="margin-top:6px">${esc(c.name)}</h4>
      <div class="meta">${esc(c.email||'')} · ${esc(c.phone||'')}</div>
      ${c.notes?`<div class="act">${esc(c.notes)}</div>`:''}
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <button class="icon-btn" onclick="loadClientToForm(${c.id})">Invoice</button>
      <button class="icon-btn" onclick="openClientModal(${c.id})">Edit</button>
      <button class="icon-btn" onclick="deleteClient(${c.id})">Delete</button>
    </div></div></div>`;
  });
  $('crm-list').innerHTML=html||'<p style="color:var(--muted);font-family:var(--font-m);font-size:12px">No clients or leads yet. Add your first prospect.</p>';
  const act=getActivity().slice(0,20);
  $('crm-activity').innerHTML=act.map(a=>`<div class="act"><strong style="color:var(--ink)">${esc(a.link||'Note')}</strong> — ${esc(a.text)}<br><span style="font-family:var(--font-m);font-size:9px">${new Date(a.at).toLocaleString()}</span></div>`).join('')||'<p style="color:var(--muted)">Activity will show here.</p>';
  const opts=[''].concat(clients.map(c=>c.name),leads.map(l=>l.name+(l.company?' / '+l.company:'')));
  $('note-link').innerHTML=opts.map(o=>`<option value="${esc(o)}">${esc(o||'General')}</option>`).join('');
}
function promoteLead(id){
  const l=getLeads().find(x=>x.id===id);if(!l)return;
  const clients=getClients();
  clients.push({id:Date.now(),name:l.company||l.name,email:l.email,phone:l.phone,addr:'',status:'Active',notes:(l.interest||'')+' · '+(l.notes||''),updated:new Date().toISOString()});
  setClients(clients);l.stage='Won';setLeads(getLeads());pushActivity('Promoted lead → client: '+(l.company||l.name));

}

    <div class="doc-meta">
      <div class="label">${type==='invoice'?'Tax Invoice':type==='quote'?'Quote':'SLA Agreement'}</div>

    <div class="columns">

      <div class="column right-col"><h3 class="${color||''}">Details</h3>
        <p><strong>Date issued:</strong> ${dateIssued}<br><strong>${detailsLabel}:</strong> ${dateDue}
        ${terms?`<br><strong>Terms:</strong> ${esc(terms)}`:''}

  <div class="doc-footer">
    <div class="footer-left"><strong>TruSaaS</strong> — True Pipeline.<br>accounts@trusaas.co.za · trusaas.co.za</div>
    <div class="footer-right">Thank you for your business.</div>
  </div>`;
}

function readLines(){
  let rows='',subtotal=0;const sym=currencySymbols[$('f-currency')?.value]||'R';
  document.querySelectorAll('.li').forEach(item=>{
    const desc=item.querySelector('.li-desc')?.value.trim()||'';
    const detail=item.querySelector('.li-detail')?.value.trim()||'';
    const qty=parseFloat(item.querySelector('.li-qty')?.value)||0;
    const rate=parseFloat(item.querySelector('.li-rate')?.value)||0;
    if(!desc&&!detail&&!qty&&!rate)return;
    const amount=qty*rate;subtotal+=amount;
    rows+=`<tr><td>${esc(desc||'Item')}${detail?`<br><span style="font-size:12px;color:#64748b">${esc(detail)}</span>`:''}</td><td>${qty}</td><td>${fmtMoney(rate,sym)}</td><td>${fmtMoney(amount,sym)}</td></tr>`;
  });
  return{rows,subtotal,sym};
}

function renderInvoice(){
  const sym=currencySymbols[$('f-currency')?.value]||'R';
  const {rows,subtotal}=readLines();
  const vatOn=$('f-vat')?.checked;const vatRate=parseFloat($('f-vat-rate')?.value)||0;
  const vat=vatOn?subtotal*(vatRate/100):0;const total=subtotal+vat;
  const vatRow=vatOn?`<div class="totals-row"><span>VAT (${vatRate}%)</span><span>${fmtMoney(vat,sym)}</span></div>`:'';
  const paid=$('f-paid')?.checked;
  return buildDocHTML('invoice',$('f-inv-num')?.value||'TS-INV',$('f-paid')?.checked?'invoice paid':'invoice',paid?'Paid':'Pending',
    $('f-client-name')?.value||'Client',($('f-client-addr')?.value||'').replace(/\n/g,'<br>'),$('f-client-email')?.value||'',$('f-client-phone')?.value||'',
    fmtDate($('f-date-issued')?.value),fmtDate($('f-date-due')?.value),$('f-terms')?.value,$('f-currency')?.value,
    rows,subtotal,vatRow,total,sym,$('f-bank-details')?.value||'','','');
}
function renderQuote(){
  const sym=currencySymbols[$('f-currency')?.value]||'R';
  const {rows,subtotal}=readLines();
  const vatOn=$('f-vat')?.checked;const vatRate=parseFloat($('f-vat-rate')?.value)||0;
  const vat=vatOn?subtotal*(vatRate/100):0;const total=subtotal+vat;
  const vatRow=vatOn?`<div class="totals-row"><span>VAT (${vatRate}%)</span><span>${fmtMoney(vat,sym)}</span></div>`:'';
  const ok=$('f-approved')?.checked;
  const extra=`<div class="section"><h3 class="quote">Quote validity</h3>
    <div class="validity-box"><p><strong>Valid until:</strong> ${fmtDate($('f-valid-until')?.value)}</p>
    <p style="margin-top:6px">After expiry, pricing may change.</p></div></div>
    <div class="section"><h3 class="quote">Scope</h3><p>${esc($('f-scope')?.value||'').replace(/\n/g,'<br>')}</p></div>
    <div class="section"><h3 class="quote">Acceptance</h3><p>Reply APPROVED or sign below. Invoice follows acceptance.</p>
      <div class="sign-block"><div class="sign-row">
        <div><div class="sign-field"></div><div class="sign-label">Client signature</div></div>
        <div><div class="sign-field"></div><div class="sign-label">Date</div></div>
      </div></div></div>`;
  return buildDocHTML('quote',$('f-quote-num')?.value||'TS-QTE',ok?'quote approved':'quote',ok?'Approved':'Quote',
    $('f-client-name')?.value||'Client',($('f-client-addr')?.value||'').replace(/\n/g,'<br>'),$('f-client-email')?.value||'',$('f-client-phone')?.value||'',
    fmtDate($('f-date-issued')?.value),fmtDate($('f-valid-until')?.value),$('f-terms')?.value,$('f-currency')?.value,
    rows,subtotal,vatRow,total,sym,'',extra,'quote');
}
function renderSLA(){
  const sym=currencySymbols[$('f-currency')?.value]||'R';
  const fee=parseFloat($('f-monthly-fee')?.value)||0;
  const signed=$('f-signed')?.checked;
  const pkg=$('f-package')?.value||'Full Stack';
  const extra=`<div class="section"><h3 class="sla">Service</h3>
    <p>TruSaaS provides <strong>${esc(pkg)}</strong> under this SLA.</p></div>
    <div class="section"><h3 class="sla">Pricing</h3>
      <div class="totals" style="justify-content:flex-start"><div class="totals-box">
        <div class="totals-row"><span>Monthly fee</span><span>${fmtMoney(fee,sym)}</span></div>
        <div class="totals-row"><span>Term</span><span>${esc($('f-term-length')?.value)}</span></div>
        <div class="totals-row total sla"><span>First month</span><span>${fmtMoney(fee,sym)}</span></div>
      </div></div></div>
    <div class="section"><h3 class="sla">TruSaaS commitments</h3><p>${esc($('f-commitments')?.value||'').replace(/\n/g,'<br>')}</p></div>
    <div class="section"><h3 class="sla">Client obligations</h3><p>${esc($('f-obligations')?.value||'').replace(/\n/g,'<br>')}</p></div>
    <div class="section"><h3 class="sla">Governing law</h3><p>Laws of <strong>${esc($('f-governing-law')?.value||'South Africa')}</strong>.</p></div>
    <div class="section"><h3 class="sla">Signatures</h3>
      <div class="sign-block"><div class="sign-row">
        <div><div class="sign-field"></div><div class="sign-label">TruSaaS — Paul de Beer</div></div>
        <div><div class="sign-field"></div><div class="sign-label">${esc($('f-client-name')?.value||'Client')} — ${esc($('f-client-contact')?.value||'')}</div></div>
      </div></div></div>`;
  return buildDocHTML('sla',$('f-sla-num')?.value||'TS-SLA',signed?'sla signed':'sla',signed?'Signed':'Draft',
    $('f-client-name')?.value||'Client',($('f-client-addr')?.value||'').replace(/\n/g,'<br>'),$('f-client-email')?.value||'',$('f-client-phone')?.value||'',
    fmtDate($('f-date-issued')?.value),$('f-term-length')?.value,'',$('f-currency')?.value,'',0,'',0,sym,'',extra,'sla');
}

function render(){
  if(currentView==='crm')return;
  const out=currentDocType==='invoice'?renderInvoice():currentDocType==='quote'?renderQuote():renderSLA();
  $('doc-output').innerHTML=out;
  $('btn-convert').style.display=currentDocType==='quote'?'inline-flex':'none';
}

function wireEvents(){
  document.querySelectorAll('.form-panel input,.form-panel textarea,.form-panel select').forEach(el=>{
    el.addEventListener('input',render);el.addEventListener('change',render);
  });
  $('add-line')?.addEventListener('click',()=>{
    const box=$('line-items');const i=box.children.length;
    box.insertAdjacentHTML('beforeend',makeLineItemHTML(i));
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',render));
    render();
  });
  $('save-pdf-btn')?.addEventListener('click',saveAsPDF);
  $('save-html-btn')?.addEventListener('click',saveAsHTML);
  $('print-btn')?.addEventListener('click',()=>window.print());
  $('save-draft-form-btn')?.addEventListener('click',openSaveDraft);
  $('convert-btn')?.addEventListener('click',convertQuoteToInvoice);
}

function switchView(type){
  currentView=type;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('on',t.dataset.type===type);
  });
  if(type==='crm'){
    $('docs-workspace').style.display='none';
    $('crm-workspace').style.display='block';
    $('drafts-bar').style.display='none';
    renderCRM();
    return;
  }
  currentDocType=type;
  $('docs-workspace').style.display='grid';
  $('crm-workspace').style.display='none';
  $('drafts-bar').style.display='flex';
  $('form-panel').innerHTML=type==='invoice'?getInvoiceForm():type==='quote'?getQuoteForm():getSLAForm();
  const cfg={invoice:'',quote:'blue',sla:'purple'}[type];
  $('btn-print').className='print-btn '+cfg;
  wireEvents();render();renderDrafts();
}

/* Drafts */
function getFormData(){
  const data={};document.querySelectorAll('.form-panel input,.form-panel textarea,.form-panel select').forEach(el=>{
    if(!el.id)return;data[el.id]=el.type==='checkbox'?el.checked:el.value;
  });
  data.__lines=[];document.querySelectorAll('.li').forEach(item=>{
    data.__lines.push({
      desc:item.querySelector('.li-desc')?.value||'',
      detail:item.querySelector('.li-detail')?.value||'',
      qty:item.querySelector('.li-qty')?.value||'',
      rate:item.querySelector('.li-rate')?.value||''
    });
  });
  data.__type=currentDocType;
  return data;
}
function restoreFormData(data){
  if(!data)return;
  Object.entries(data).forEach(([id,val])=>{
    if(id.startsWith('__'))return;
    const el=$(id);if(!el)return;
    if(el.type==='checkbox')el.checked=!!val;else el.value=val??'';
  });
  if(data.__lines){
    const box=$('line-items');if(box){
      box.innerHTML='';
      data.__lines.forEach((l,i)=>box.insertAdjacentHTML('beforeend',makeLineItemHTML(i,l.desc,l.detail,l.qty,l.rate)));
      box.querySelectorAll('input').forEach(i=>i.addEventListener('input',render));
    }
  }
  render();
}
function openSaveDraft(){openModal('draft-modal');$('draft-name').value='';$('draft-name').focus()}
function saveDraft(){
  const name=$('draft-name').value.trim()||(currentDocType+' '+new Date().toLocaleDateString());
  const drafts=LS.get('ts_drafts',[]);
  drafts.unshift({id:Date.now(),name,type:currentDocType,data:getFormData(),at:new Date().toISOString()});
  LS.set('ts_drafts',drafts.slice(0,40));
  closeModal('draft-modal');renderDrafts();toast('Draft saved',true);
}
function loadDraft(id){
  const d=LS.get('ts_drafts',[]).find(x=>x.id===id);if(!d)return;
  switchView(d.type||'invoice');
  setTimeout(()=>{restoreFormData(d.data);toast('Loaded '+d.name,true)},60);
}
function delDraft(id,e){e?.stopPropagation();LS.set('ts_drafts',LS.get('ts_drafts',[]).filter(x=>x.id!==id));renderDrafts()}
function renderDrafts(){
  const list=LS.get('ts_drafts',[]);
  $('drafts-list').innerHTML=list.length?list.map(d=>`<span class="chip" onclick="loadDraft(${d.id})">${esc(d.name)} <span class="x" onclick="delDraft(${d.id},event)">×</span></span>`).join(''):'<span style="font-family:var(--font-m);font-size:10px;color:var(--muted)">No drafts</span>';
}

function convertQuoteToInvoice(){
  if(currentDocType!=='quote')return;
  const data=getFormData();
  data['f-inv-num']=consumeNum('invoice');
  data['f-date-issued']=todayVal();
  data['f-date-due']=futureVal(30);
  data['f-paid']=false;
  data['f-terms']=data['f-terms']||'Net 30';
  if(!data['f-bank-details'])data['f-bank-details']='TruSaaS\nCapitec: 2006894672\nReference: Invoice number';
  switchView('invoice');
  setTimeout(()=>{
    restoreFormData(data);
    pushActivity('Quote converted to invoice '+data['f-inv-num'],data['f-client-name']||'');
    toast('Converted to invoice',true);
  },60);
}

function saveAsHTML(){
  const num=$($('f-inv-num')?'f-inv-num':$('f-quote-num')?'f-quote-num':'f-sla-num')?.value||'doc';
  const content=$('doc-output').innerHTML;
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>TruSaaS ${num}</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
  body{font-family:'DM Sans',sans-serif;background:#f1f5f9;padding:24px;color:#0f172a}
  .doc-page{max-width:210mm;margin:0 auto;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  ${document.querySelector('style').innerHTML.match(/\/\* LIGHT document[\s\S]*?\.sign-label\{[^}]+\}/)?.[0]||''}
  @media print{body{padding:0;background:#fff}.doc-page{box-shadow:none}}
  </style></head><body><div class="doc-page">${content}</div></body></html>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=`TruSaaS-${currentDocType}-${num}.html`;a.click();
  toast('HTML saved',true);
}

function saveAsPDF(){
  const numEl=$('f-inv-num')||$('f-quote-num')||$('f-sla-num');
  const docNum=numEl?.value||'doc';
  const root=$('pdf-root');
  // Full A4 white page clone
  root.innerHTML=`<div class="doc-page" id="pdf-page">${$('doc-output').innerHTML}</div>`;
  root.classList.add('pdf-export');
  const page=$('pdf-page');
  toast('Building full-page PDF…');
  const opt={
    margin:[10,10,10,10],
    filename:`TruSaaS-${currentDocType.toUpperCase()}-${docNum}.pdf`,
    image:{type:'jpeg',quality:0.98},
    html2canvas:{
      scale:2,
      useCORS:true,
      backgroundColor:'#ffffff',
      logging:false,
      windowWidth:794,
      letterRendering:true
    },
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
    pagebreak:{mode:['avoid-all','css','legacy']}
  };
  html2pdf().set(opt).from(page).save().then(()=>{
    root.innerHTML='';
    toast('PDF saved (A4 full page)',true);
    pushActivity('Exported PDF '+docNum, $('f-client-name')?.value||'');
  }).catch(err=>{
    console.error(err);
    root.innerHTML='';
    toast('PDF failed — try Print',false);
  });
}

function exportAllJSON(){
  const blob=new Blob([JSON.stringify({
    clients:getClients(),leads:getLeads(),activity:getActivity(),drafts:LS.get('ts_drafts',[]),exported:new Date().toISOString()
  },null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trusaas-crm-export.json';a.click();
  toast('CRM data exported',true);
}

switchView('invoice');
