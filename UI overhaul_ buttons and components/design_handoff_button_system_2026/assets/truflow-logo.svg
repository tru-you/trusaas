
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
    <defs>
      <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"></stop>
        <stop offset="25%" stop-color="#E2E8F0"></stop>
        <stop offset="50%" stop-color="#94A3B8"></stop>
        <stop offset="75%" stop-color="#334155"></stop>
        <stop offset="100%" stop-color="#0F172A"></stop>
      </linearGradient>
      <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#E0F2FE"></stop>
        <stop offset="25%" stop-color="#38BDF8"></stop>
        <stop offset="50%" stop-color="#0088FF"></stop>
        <stop offset="75%" stop-color="#0055CC"></stop>
        <stop offset="100%" stop-color="#002266"></stop>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="10" result="blur"></feGaussianBlur>
        <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
      </filter>
    </defs>
    <text x="600" y="210" font-family="&#39;Plus Jakarta Sans&#39;, sans-serif" font-weight="900" font-size="160" text-anchor="middle">
      <tspan fill="url(#chrome)">Tru</tspan>
      <tspan fill="url(#blue)" filter="url(#glow)">Flow</tspan>
    </text>
    <text x="600" y="340" font-family="&#39;Plus Jakarta Sans&#39;, sans-serif" font-weight="800" font-size="56" fill="url(#blue)" filter="url(#glow)" letter-spacing="12" text-anchor="middle">
      L I T E
    </text>
  </svg>